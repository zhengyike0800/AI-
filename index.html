



<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a101e">
<title>Sports AI v1.2</title>
<style>
:root{
 --bg:#0a101e;--card:#111b2e;
 --soft:#202d43;--red:#fb3659;
 --muted:#aab8cd
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:#f5f7fd;
 font-family:-apple-system,BlinkMacSystemFont,
 "Noto Sans TC",sans-serif
}
header{
 background:linear-gradient(135deg,#202940,#0b1120);
 padding:22px 18px
}
.brand{font-size:28px;font-weight:850}
.brand b{color:var(--red)}
small,.muted{
 color:var(--muted);font-size:12px;line-height:1.6
}
.row{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px
}
.chip{
 color:#ffd9df;background:#5b2339;
 border-radius:20px;padding:7px 11px;font-size:12px
}
main{max-width:680px;margin:auto;padding:18px 13px 115px}
h1{font-size:22px;margin:2px 0 7px}
button,input{font:inherit}
button{
 background:#212d42;border:0;border-radius:11px;
 padding:12px 9px;color:white;cursor:pointer
}
.primary{
 background:linear-gradient(100deg,#fc3b60,#b61e3e)
}
.controls{display:flex;gap:7px;margin:13px 0}
.controls button{flex:1;font-size:13px;min-width:0}
.search{
 width:100%;background:#202c40;
 border:1px solid #42516a;border-radius:11px;
 padding:13px;color:white;font-size:16px
}
.status{
 border:1px solid #394b65;background:#141e30;
 border-radius:11px;margin:13px 0;padding:12px;
 color:#c3ccda;font-size:12px;line-height:1.7
}
.card{
 border:1px solid #694052;background:#111a2c;
 border-radius:19px;overflow:hidden;margin:14px 0
}
.cardhead{
 background:linear-gradient(95deg,#fb3b60,#b91d42);
 padding:13px 15px;font-weight:800
}
.content{padding:15px}
.teams{
 display:grid;grid-template-columns:1fr 34px 1fr;
 align-items:center;text-align:center;
 gap:8px;margin:13px 0
}
.team{min-width:0;font-weight:750}
.team img{
 width:56px;height:56px;object-fit:contain;
 display:block;margin:0 auto 7px
}
.vs{color:#93a5bd;font-size:12px}
.score{font-size:23px;color:#ff647b;font-weight:800}
.prediction{
 border:1px solid #4b637e;background:#17253a;
 border-radius:12px;padding:13px;margin:13px 0
}
.prediction .top{
 display:flex;justify-content:space-between;
 gap:8px;font-size:12px;color:#c7d6ea
}
.prob{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;margin-top:13px;text-align:center
}
.prob b{font-size:26px;color:#fff}
.prob small{display:block}
.bar{
 display:flex;height:8px;border-radius:10px;
 overflow:hidden;background:#39455b;margin-top:12px
}
.bar span:first-child{background:#fb3659}
.bar span:last-child{background:#6184ca}
.market{
 display:grid;grid-template-columns:1.1fr 1fr 1fr;
 gap:7px;margin:13px 0
}
.market div{
 background:#202d43;border-radius:9px;
 padding:11px 5px;text-align:center;
 min-width:0;font-size:13px
}
.market .lab{
 color:#aab8cc;background:transparent;
 font-size:11px;padding:6px 1px
}
.note{
 padding:12px;border:1px solid #553748;
 background:#1a2539;border-radius:12px;
 font-size:13px;line-height:1.75
}
.note strong{
 display:block;color:#ff8197;margin-bottom:5px
}
.foot{
 color:#a9b7ca;font-size:11px;
 margin-top:10px;line-height:1.7
}
.actionrow{
 display:flex;justify-content:flex-end;margin-top:12px
}
.empty{padding:30px;text-align:center;color:var(--muted)}
nav{
 position:fixed;bottom:0;left:0;width:100%;
 display:grid;grid-template-columns:repeat(5,1fr);
 background:#101a2b;border-top:1px solid #2f3c50;
 padding:8px 3px max(13px,env(safe-area-inset-bottom));
 z-index:5
}
nav button{
 background:none;font-size:11px;
 color:#abb8c9;padding:4px 0
}
nav button.active{color:#ff6e87}
nav span{display:block;font-size:22px;margin-bottom:3px}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
<div class="row">
 <div>
  <div class="brand">賽事 <b>AI</b></div>
  <small>SPORTS INTELLIGENCE · NBA</small>
 </div>
 <span class="chip">🇹🇼 台灣時間</span>
</div>
</header>

<main>
<div class="row">
 <div>
  <h1 id="title">NBA 賽事分析</h1>
  <small id="dateLabel"></small>
 </div>
 <span class="chip" id="count">— 場</span>
</div>

<div class="controls">
 <button id="prev">◀ 前一天</button>
 <button id="today" class="primary">今天</button>
 <button id="next">後一天 ▶</button>
 <button id="refresh">⟳</button>
</div>

<input id="search" class="search"
 placeholder="搜尋球隊（中文／英文縮寫）">

<div class="status" id="status">正在讀取 NBA 資料…</div>
<div id="cards"></div>

<div class="status hidden" id="settings">
 <b>Sports AI v1.2</b>
 <p>開啟 App 時讀取資料，開啟期間每五分鐘更新。</p>
 <p>
 研究模型結合上季例行賽戰績、本季正式戰績、
 固定主場優勢。尚未納入球員傷兵、先發陣容、
 球隊休賽季異動，模型也尚未完成歷史校準。
 </p>
 <button id="clear">清空收藏</button>
</div>

<small>
賽程、比分與盤口來源：ESPN 公開資料介面。
戰績模型屬研究用途，並非投注建議。
</small>
</main>

<nav>
 <button class="active" data-page="home">
  <span>⌂</span>首頁
 </button>
 <button data-page="scores">
  <span>▥</span>比分
 </button>
 <button data-page="schedule">
  <span>▦</span>賽事
 </button>
 <button data-page="favs">
  <span>☆</span>收藏
 </button>
 <button data-page="mine">
  <span>♙</span>我的
 </button>
</nav>

<script>
"use strict";

const API=
"https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=";

const STANDINGS=
"https://site.api.espn.com/apis/v2/sports/basketball/nba/standings?season=";

const ZH={
 ATL:"老鷹",BOS:"塞爾提克",BKN:"籃網",
 BRK:"籃網",CHA:"黃蜂",CHI:"公牛",
 CLE:"騎士",DAL:"獨行俠",DEN:"金塊",
 DET:"活塞",GS:"勇士",GSW:"勇士",
 HOU:"火箭",IND:"溜馬",LAC:"快艇",
 LAL:"湖人",MEM:"灰熊",MIA:"熱火",
 MIL:"公鹿",MIN:"灰狼",NO:"鵜鶘",
 NOP:"鵜鶘",NY:"尼克",NYK:"尼克",
 OKC:"雷霆",ORL:"魔術",PHI:"76人",
 PHX:"太陽",POR:"拓荒者",SA:"馬刺",
 SAS:"馬刺",SAC:"國王",TOR:"暴龍",
 UTA:"爵士",UTAH:"爵士",WAS:"巫師",
 WSH:"巫師"
};

const $=id=>document.getElementById(id);

let offset=0;
let page="home";
let games=[];
let request=0;
let lastUpdated=null;
let priorRecords=new Map();
let currentRecords=new Map();
let recordsStatus="尚未讀取";
let fav=[];

try{
 const saved=JSON.parse(
  localStorage.getItem("sportsai_fav_v1")||"[]"
 );
 if(Array.isArray(saved))fav=saved;
}catch(e){}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function taiwanDate(date){
 const p=new Intl.DateTimeFormat("en-US",{
  timeZone:"Asia/Taipei",year:"numeric",
  month:"2-digit",day:"2-digit"
 }).formatToParts(date);

 const a={};
 for(const x of p)a[x.type]=x.value;
 return a.year+"-"+a.month+"-"+a.day;
}

function chosen(){
 const [y,m,d]=taiwanDate(new Date())
  .split("-").map(Number);

 return new Date(
  Date.UTC(y,m-1,d+offset)
 ).toISOString().slice(0,10);
}

function twTime(d){
 return new Intl.DateTimeFormat("zh-TW",{
  timeZone:"Asia/Taipei",
  month:"2-digit",day:"2-digit",
  hour:"2-digit",minute:"2-digit",
  hour12:false
 }).format(new Date(d));
}

function name(c){
 const t=c?.team||{};
 return ZH[t.abbreviation]||
  t.displayName||"未知隊伍";
}

function logo(c){
 const t=c?.team||{};
 return t.logo||t.logos?.[0]?.href||"";
}

function gameState(g){
 const s=g.status?.type?.state;
 return s==="post"?"已完賽":
  s==="in"?"進行中":"尚未開賽";
}

function pctAmerican(v){
 if(v===null||v===undefined||v==="")return null;
 const n=Number(v);
 if(!Number.isFinite(n)||!n)return null;
 return n>0?100/(n+100):-n/(-n+100);
}

function oddsInfo(g,a,h){
 const o=g.competitions?.[0]?.odds?.[0];

 if(!o)return {
  sa:"待取得",sh:"待取得",
  away:"—",home:"—",
  source:"未提供",details:""
 };

 const ap=pctAmerican(o.awayTeamOdds?.moneyLine);
 const hp=pctAmerican(o.homeTeamOdds?.moneyLine);
 const total=ap!==null&&hp!==null?ap+hp:null;

 let sa="待取得",sh="待取得";
 const detail=String(o.details||"").trim();
 const match=detail.match(
  /^([A-Z]{2,5})\s*([+-]\d+(?:\.\d+)?)$/i
 );

 if(match){
  const code=match[1].toUpperCase();
  const pts=Number(match[2]);
  const ac=String(a.team?.abbreviation||"").toUpperCase();
  const hc=String(h.team?.abbreviation||"").toUpperCase();
  const fmt=x=>x>0?"+"+x:String(x);

  if(code===ac){
   sa=fmt(pts);
   sh=fmt(-pts);
  }else if(code===hc){
   sa=fmt(-pts);
   sh=fmt(pts);
  }
 }

 return {
  sa,sh,details:detail,
  away:total?(100*ap/total).toFixed(1)+"%":"—",
  home:total?(100*hp/total).toFixed(1)+"%":"—",
  source:o.provider?.name||"ESPN"
 };
}

// ESPN 戰績統計有時使用 name，有時使用 abbreviation。
function statValue(stats,names){
 const s=stats.find(x=>
  names.includes(String(x.name||"").toLowerCase())||
  names.includes(String(x.abbreviation||"").toLowerCase())
 );
 const value=Number(s?.value??s?.displayValue);
 return Number.isFinite(value)?value:null;
}

function parseStandings(data){
 const result=new Map();

 function walk(node){
  if(!node||typeof node!=="object")return;

  if(Array.isArray(node)){
   node.forEach(walk);
   return;
  }

  if(Array.isArray(node.entries)){
   for(const entry of node.entries){
    const team=entry.team||{};
    const stats=entry.stats||[];

    const w=statValue(stats,["wins","w"]);
    const l=statValue(stats,["losses","l"]);

    if(team.id&&w!==null&&l!==null&&
       w>=0&&l>=0){
     result.set(String(team.id),{
      w,l,n:w+l,p:(w+l)?w/(w+l):0.5
     });
    }
   }
  }

  if(Array.isArray(node.children)){
   node.children.forEach(walk);
  }

  if(node.standings&&node.standings!==node){
   walk(node.standings);
  }
 }

 walk(data);
 return result;
}

function seasonEnd(day){
 const [y,m]=day.split("-").map(Number);
 return m>=10?y+1:y;
}

async function fetchJson(url){
 const ctl=new AbortController();
 const timer=setTimeout(()=>ctl.abort(),15000);

 try{
  const r=await fetch(url,{
   signal:ctl.signal,
   cache:"no-store"
  });
  if(!r.ok)throw Error("HTTP "+r.status);
  return await r.json();
 }finally{
  clearTimeout(timer);
 }
}

async function fetchDay(day){
 const data=await fetchJson(
  API+day.replace(/-/g,"")
 );
 return data.events||[];
}

function stage(g){
 const hours=(new Date(g.date)-new Date())/3600000;

 if(gameState(g)!=="尚未開賽")return "比賽已開始";
 if(hours>12)return "提前預測";
 if(hours>2)return "賽前 12 小時內";
 if(hours>0.5)return "賽前 2 小時內";
 return "開賽前 30 分鐘內";
}

function recordFor(c,map){
 return map.get(String(c.team?.id||""))||null;
}

// 上季戰績只作為實力先驗。
// 上季 12 場的等效權重，逐漸交給本季實際結果。
// 主場優勢使用固定假設，尚未完成歷史校準。
function model(a,h,g){
 if(gameState(g)!=="尚未開賽")return null;

 const ap=recordFor(a,priorRecords);
 const hp=recordFor(h,priorRecords);
 if(!ap||!hp||ap.n<20||hp.n<20)return null;

 const ac=recordFor(a,currentRecords);
 const hc=recordFor(h,currentRecords);

 const effective=12;

 const aRate=(
  ap.p*effective+(ac?.w||0)
 )/(effective+(ac?.n||0));

 const hRate=(
  hp.p*effective+(hc?.w||0)
 )/(effective+(hc?.n||0));

 const sigmoid=x=>1/(1+Math.exp(-x));
 const raw=sigmoid(
  2.4*(hRate-aRate)+0.12
 );

 const home=Math.max(0.15,Math.min(0.85,raw));

 return {
  home,away:1-home,
  ap,hp,ac,hc,
  aRate,hRate
 };
}

function teamBlock(c,played){
 const image=logo(c);

 return `
 <div class="team">
 ${image?`
  <img src="${esc(image)}"
   alt="${esc(name(c))}隊徽"
   loading="lazy">`:""}
 <div>${esc(name(c))}</div>
 <small>
 ${esc(c.team?.abbreviation||"")}
 · ${c.homeAway==="home"?"主":"客"}
 </small>
 ${played?`
  <div class="score">${esc(c.score??"—")}</div>
 `:""}
 </div>`;
}

function predictionBlock(a,h,m,g){
 if(gameState(g)!=="尚未開賽"){
  return `
  <div class="prediction">
   <b>預測已停止</b>
   <p class="muted">
    比賽已開始或完賽，
    不使用賽後資料假冒賽前預測。
   </p>
  </div>`;
 }

 if(!m){
  return `
  <div class="prediction">
   <div class="top">
    <b>獨贏勝率｜研究模型</b>
    <span>${esc(stage(g))}</span>
   </div>
   <p class="muted">
    上季正式戰績尚未完整取得，
    或缺少足夠歷史資料。
    暫不生成沒有數據依據的百分比。
   </p>
  </div>`;
 }

 const away=(m.away*100).toFixed(1);
 const home=(m.home*100).toFixed(1);

 return `
 <div class="prediction">
  <div class="top">
   <b>獨贏勝率｜初步模型</b>
   <span>${esc(stage(g))}</span>
  </div>

  <div class="prob">
   <div>
    <small>${esc(name(a))}</small>
    <b>${away}%</b>
   </div>
   <div>
    <small>${esc(name(h))}</small>
    <b>${home}%</b>
   </div>
  </div>

  <div class="bar">
   <span style="width:${away}%"></span>
   <span style="width:${home}%"></span>
  </div>

  <p class="muted">
   依據上季例行賽戰績、
   本季已取得的正式戰績與固定主場調整。
   尚未考慮傷兵、轉隊及預計先發，
   亦未進行勝率校準。
  </p>
 </div>`;
}

function card(g){
 const c=g.competitions?.[0]?.competitors||[];
 const a=c.find(x=>x.homeAway==="away");
 const h=c.find(x=>x.homeAway==="home");
 if(!a||!h)return "";

 const o=oddsInfo(g,a,h);
 const m=model(a,h,g);
 const played=gameState(g)!=="尚未開賽";

 let summary;

 if(played){
  summary="比賽已開始或完賽，不倒推賽前預測。";
 }else if(m){
  const leader=m.home>=m.away?name(h):name(a);
  summary=
   "根據歷史戰績與主場調整，初步模型偏向"+
   leader+
   "。尚未核實傷兵、球員轉隊與先發陣容，"+
   "因此只能作為賽前研究參考。";
 }else{
  summary=
   "目前無法取得足夠的上季戰績，"+
   "暫不提供模型勝率。";
 }

 return `
 <article class="card">
  <div class="cardhead">
   NBA｜${esc(gameState(g))}
   · ${esc(twTime(g.date))}
  </div>

  <div class="content">
   <div class="teams">
    ${teamBlock(a,played)}
    <span class="vs">VS</span>
    ${teamBlock(h,played)}
   </div>

   ${predictionBlock(a,h,m,g)}

   <div class="market">
    <div class="lab">隊伍</div>
    <div class="lab">獨贏市場機率</div>
    <div class="lab">讓分</div>

    <div>${esc(name(a))}</div>
    <div>${esc(o.away)}</div>
    <div>${esc(o.sa)}</div>

    <div>${esc(name(h))}</div>
    <div>${esc(o.home)}</div>
    <div>${esc(o.sh)}</div>
   </div>

   <div class="note">
    <strong>AI 分析摘要｜研究版</strong>
    ${esc(summary)}
   </div>

   <div class="foot">
    上季／本季戰績：ESPN<br>
    歷史戰績狀態：${esc(recordsStatus)}<br>
    盤口來源：${esc(o.source)}<br>
    盤口原文：${esc(o.details||"未提供")}<br>
    盤口時間未經驗證。<br>
    模型勝率不等於市場隱含機率。<br>
    傷兵／先發：尚未接入。<br>
    讓分過盤勝率：待驗證。
   </div>

   <div class="actionrow">
    <button data-fav="${esc(g.id)}">
     ${fav.includes(g.id)?
      "★ 已收藏":"☆ 收藏"}
    </button>
   </div>
  </div>
 </article>`;
}

function render(){
 const labels={
  home:"NBA 賽事分析",
  scores:"NBA 比分",
  schedule:"NBA 賽程",
  favs:"我的收藏",
  mine:"我的設定"
 };

 $("title").textContent=labels[page];
 $("dateLabel").textContent=
  chosen()+" · 台灣日期";

 $("settings").classList.toggle(
  "hidden",page!=="mine"
 );
 $("cards").classList.toggle(
  "hidden",page==="mine"
 );
 $("search").classList.toggle(
  "hidden",page==="mine"
 );

 document.querySelectorAll("nav button")
  .forEach(b=>{
   b.classList.toggle(
    "active",b.dataset.page===page
   );
  });

 const q=$("search").value.toLowerCase().trim();

 const list=games.filter(g=>{
  const c=g.competitions?.[0]?.competitors||[];

  const match=c.some(x=>
   (name(x)+" "+(x.team?.abbreviation||""))
   .toLowerCase().includes(q)
  );

  return match &&
   (page!=="favs"||fav.includes(g.id)) &&
   (page!=="scores"||
    g.status?.type?.state!=="pre");
 });

 $("count").textContent=
  page==="mine"?"設定":list.length+" 場";

 $("cards").innerHTML=page==="mine"?"":(
  list.map(card).join("")||
  '<div class="empty">沒有符合條件的賽事</div>'
 );
}

async function load(){
 const id=++request;
 const date=chosen();

 const prior=new Date(
  new Date(date+"T00:00:00Z").getTime()-86400000
 ).toISOString().slice(0,10);

 const ending=seasonEnd(date);

 $("status").textContent=
  "正在讀取 ESPN 賽程與歷史戰績…";

 const results=await Promise.allSettled([
  fetchDay(prior),
  fetchDay(date),
  fetchJson(STANDINGS+(ending-1)),
  fetchJson(STANDINGS+ending)
 ]);

 if(id!==request)return;

 if(results[0].status==="rejected"&&
    results[1].status==="rejected"){
  $("status").textContent=
   "賽程連線失敗，請重新整理。";
  return;
 }

 const map=new Map();

 for(const r of results.slice(0,2)){
  if(r.status!=="fulfilled")continue;

  for(const g of r.value){
   if(g.id&&g.date&&
      taiwanDate(new Date(g.date))===date){
    map.set(g.id,g);
   }
  }
 }

 games=[...map.values()].sort(
  (a,b)=>new Date(a.date)-new Date(b.date)
 );

 priorRecords=results[2].status==="fulfilled"?
  parseStandings(results[2].value):new Map();

 currentRecords=results[3].status==="fulfilled"?
  parseStandings(results[3].value):new Map();

 recordsStatus=
  "上季 "+priorRecords.size+" 隊"+
  "，本季 "+currentRecords.size+" 隊";

 lastUpdated=new Date();

 $("status").textContent=
  "更新："+twTime(lastUpdated)+
  " · ESPN｜"+recordsStatus+
  "。App 開啟期間每 5 分鐘更新。";

 render();
}

$("prev").onclick=()=>{offset--;load()};
$("next").onclick=()=>{offset++;load()};
$("today").onclick=()=>{offset=0;load()};
$("refresh").onclick=load;
$("search").oninput=render;

document.querySelectorAll("nav button")
 .forEach(b=>{
  b.onclick=()=>{
   page=b.dataset.page;
   render();
   window.scrollTo(0,0);
  };
 });

$("cards").onclick=e=>{
 const b=e.target.closest("[data-fav]");
 if(!b)return;

 const id=b.dataset.fav;
 fav=fav.includes(id)?
  fav.filter(x=>x!==id):[...fav,id];

 try{
  localStorage.setItem(
   "sportsai_fav_v1",JSON.stringify(fav)
  );
 }catch(e){}
 render();
};

$("clear").onclick=()=>{
 if(confirm("確定清空收藏？")){
  fav=[];
  try{
   localStorage.removeItem("sportsai_fav_v1");
  }catch(e){}
  render();
 }
};

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden)load();
});

window.addEventListener("focus",()=>{
 if(lastUpdated&&
  Date.now()-lastUpdated.getTime()>300000
 )load();
});

load();

setInterval(()=>{
 if(!document.hidden)load();
},300000);
</script>
</body>
</html>
