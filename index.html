<!DOCTYPE html>
<html lang="zh-Hant">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sports AI v0.2</title>
<style>
body{margin:0;background:#090e19;color:white;font-family:Arial,sans-serif}
header{padding:28px 20px;background:#172136;font-size:30px;font-weight:bold}
header span{color:#ff3655}
main{padding:18px}
button{background:#ec284b;color:white;border:0;padding:12px;border-radius:10px;margin:4px}
.card{background:#172238;border:1px solid #38475e;border-radius:16px;padding:18px;margin:15px 0}
.logo{width:65px;height:65px;object-fit:contain}
.teams{display:flex;justify-content:space-around;text-align:center;align-items:center}
small{color:#aab6c9}
</style>
<header>賽事 <span>AI</span></header>
<main>
<h2>NBA 賽程與比分</h2>
<button onclick="change(-1)">前一天</button>
<button onclick="change(0)">今天</button>
<button onclick="change(1)">後一天</button>
<button onclick="load()">重新整理</button>
<p id="date"></p>
<p id="status">準備載入賽程</p>
<div id="games"></div>
</main>
<script>
let offset=0;
const names={LAL:"湖人",UTA:"爵士",GS:"勇士",GSW:"勇士",BOS:"塞爾提克",OKC:"雷霆",MIN:"灰狼",NY:"尼克",NYK:"尼克",PHI:"76人"};
function change(n){offset=n;load()}
function getDate(){
let s=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
let [y,m,d]=s.split("-").map(Number);
let dt=new Date(Date.UTC(y,m-1,d+offset));
return dt.toISOString().slice(0,10).replaceAll("-","");
}
async function load(){
let date=getDate();
document.getElementById("date").textContent="台灣日期："+date;
document.getElementById("status").textContent="正在讀取 NBA 資料…";
document.getElementById("games").innerHTML="";
try{
let r=await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates="+date);
if(!r.ok)throw Error("HTTP "+r.status);
let data=await r.json();
let events=data.events||[];
document.getElementById("status").textContent="已載入 "+events.length+" 場賽事";
events.forEach(e=>{
let c=e.competitions?.[0]?.competitors||[];
let away=c.find(x=>x.homeAway==="away");
let home=c.find(x=>x.homeAway==="home");
if(!away||!home)return;
let team=x=>`<div><img class="logo" src="${x.team.logo||""}" alt=""><p>${names[x.team.abbreviation]||x.team.displayName}</p><small>${x.score??"-"}</small></div>`;
let box=document.createElement("div");
box.className="card";
let time=new Date(e.date).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
box.innerHTML=`<small>${time} · ${e.status?.type?.description||"NBA"}</small><div class="teams">${team(away)}<b>VS</b>${team(home)}</div>`;
document.getElementById("games").appendChild(box);
});
}catch(e){
document.getElementById("status").textContent="連線失敗："+e.message;
}
}
load();
</script>
</html>
