


<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a101e">
<title>Sports AI v1.1</title>
<style>
:root{
 --bg:#0a101e;
 --card:#111b2e;
 --soft:#202d43;
 --red:#fb3659;
 --muted:#aab8cd;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:#f5f7fd;
 font-family:-apple-system,BlinkMacSystemFont,
 "Noto Sans TC",sans-serif
}
header{
 background:linear-gradient(135deg,#202940,#0b1120);
 padding:22px 18px
}
.brand{font-size:28px;font-weight:850}
.brand b{color:var(--red)}
small,.muted{
 color:var(--muted);font-size:12px;line-height:1.6
}
.row{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px
}
.chip{
 color:#ffd9df;background:#5b2339;
 border-radius:20px;padding:7px 11px;font-size:12px
}
main{
 max-width:680px;margin:auto;
 padding:18px 13px 115px
}
h1{font-size:22px;margin:2px 0 7px}
button,input{font:inherit}
button{
 background:#212d42;border:0;border-radius:11px;
 padding:12px 9px;color:#f1f4fb
}
.primary{
 background:linear-gradient(100deg,#fc3b60,#b61e3e)
}
.controls{display:flex;gap:7px;margin:13px 0}
.controls button{flex:1;font-size:13px;min-width:0}
.search{
 width:100%;background:#202c40;
 border:1px solid #42516a;border-radius:11px;
 padding:13px;color:white;font-size:16px
}
.status{
 border:1px solid #394b65;background:#141e30;
 border-radius:11px;margin:13px 0;padding:12px;
 color:#c3ccda;font-size:12px;line-height:1.7
}
.card{
 border:1px solid #694052;background:#111a2c;
 border-radius:19px;overflow:hidden;margin:14px 0
}
.cardhead{
 background:linear-gradient(95deg,#fb3b60,#b91d42);
 padding:13px 15px;font-weight:800
}
.content{padding:15px}
.teams{
 display:grid;grid-template-columns:1fr 34px 1fr;
 align-items:center;text-align:center;
 gap:8px;margin:13px 0
}
.team{min-width:0;font-weight:750}
.team img{
 width:56px;height:56px;object-fit:contain;
 display:block;margin:0 auto 7px
}
.vs{color:#93a5bd;font-size:12px}
.score{font-size:23px;color:#ff647b;font-weight:800}
.market{
 display:grid;grid-template-columns:1.1fr 1fr 1fr;
 gap:7px;margin:13px 0
}
.market div{
 background:#202d43;border-radius:9px;
 padding:11px 5px;text-align:center;
 min-width:0;font-size:13px
}
.market .lab{
 color:#aab8cc;background:transparent;
 font-size:11px;padding:6px 1px
}
.prediction{
 border:1px solid #4b637e;background:#17253a;
 border-radius:12px;padding:13px;margin:13px 0
}
.prediction .top{
 display:flex;justify-content:space-between;
 gap:8px;font-size:12px;color:#c7d6ea
}
.prob{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;margin-top:12px;text-align:center
}
.prob b{font-size:23px;color:white}
.prob small{display:block}
.bar{
 display:flex;height:7px;border-radius:10px;
 overflow:hidden;background:#39455b;margin-top:12px
}
.bar span:first-child{background:#fb3659}
.bar span:last-child{background:#6184ca}
.note{
 padding:12px;border:1px solid #553748;
 background:#1a2539;border-radius:12px;
 font-size:13px;line-height:1.75
}
.note strong{
 display:block;color:#ff8197;margin-bottom:5px
}
.foot{
 color:#a9b7ca;font-size:11px;
 margin-top:10px;line-height:1.7
}
.actionrow{
 display:flex;justify-content:flex-end;margin-top:12px
}
.actionrow button{font-size:13px}
.empty{
 padding:30px;text-align:center;color:var(--muted)
}
nav{
 position:fixed;bottom:0;left:0;width:100%;
 display:grid;grid-template-columns:repeat(5,1fr);
 background:#101a2b;border-top:1px solid #2f3c50;
 padding:8px 3px max(13px,env(safe-area-inset-bottom));
 z-index:5
}
nav button{
 background:none;font-size:11px;
 color:#abb8c9;padding:4px 0
}
nav button.active{color:#ff6e87}
nav span{
 display:block;font-size:22px;margin-bottom:3px
}
.hidden{display:none!important}
</style>
</head>

<body>
<header>
<div class="row">
 <div>
  <div class="brand">賽事 <b>AI</b></div>
  <small>SPORTS INTELLIGENCE · NBA</small>
 </div>
 <span class="chip">🇹🇼 台灣時間</span>
</div>
</header>

<main>
<div class="row">
 <div>
  <h1 id="title">NBA 賽事分析</h1>
  <small id="dateLabel"></small>
 </div>
 <span class="chip" id="count">— 場</span>
</div>

<div class="controls">
 <button id="prev">◀ 前一天</button>
 <button id="today" class="primary">今天</button>
 <button id="next">後一天 ▶</button>
 <button id="refresh">⟳</button>
</div>

<input id="search" class="search"
 placeholder="搜尋球隊（中文／英文縮寫）">

<div class="status" id="status">
正在準備更新 NBA 資料…
</div>

<div id="cards"></div>

<div class="status hidden" id="settings">
 <b>Sports AI v1.1</b>
 <p>
 開啟 App 時更新，開啟期間每五分鐘重新抓取資料。
 不提供背景監控。
 </p>
 <p>
 初步模型只參考 ESPN 提供的當季戰績，
 加入固定主場調整。
 尚未納入傷兵、先發與真實市場賠率，
 也未經歷史校準。
 </p>
 <button id="clear">清空收藏</button>
</div>

<small>
資料來源：ESPN 公開賽事資料介面。部分資料可能
延遲、缺漏或停止供應。初步模型僅供研究，
不是投注建議。
</small>
</main>

<nav>
<button class="active" data-page="home">
 <span>⌂</span>首頁
</button>
<button data-page="scores">
 <span>▥</span>比分
</button>
<button data-page="schedule">
 <span>▦</span>賽事
</button>
<button data-page="favs">
 <span>☆</span>收藏
</button>
<button data-page="mine">
 <span>♙</span>我的
</button>
</nav>

<script>
"use strict";

const API=
"https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=";

const ZH={
 ATL:"老鷹",BOS:"塞爾提克",
 BKN:"籃網",BRK:"籃網",
 CHA:"黃蜂",CHI:"公牛",
 CLE:"騎士",DAL:"獨行俠",
 DEN:"金塊",DET:"活塞",
 GS:"勇士",GSW:"勇士",
 HOU:"火箭",IND:"溜馬",
 LAC:"快艇",LAL:"湖人",
 MEM:"灰熊",MIA:"熱火",
 MIL:"公鹿",MIN:"灰狼",
 NO:"鵜鶘",NOP:"鵜鶘",
 NY:"尼克",NYK:"尼克",
 OKC:"雷霆",ORL:"魔術",
 PHI:"76人",PHX:"太陽",
 POR:"拓荒者",SA:"馬刺",
 SAS:"馬刺",SAC:"國王",
 TOR:"暴龍",UTA:"爵士",
 UTAH:"爵士",WAS:"巫師",
 WSH:"巫師"
};

const $=id=>document.getElementById(id);

let offset=0;
let page="home";
let games=[];
let request=0;
let lastUpdated=null;
let fav=[];

try{
 const saved=JSON.parse(
  localStorage.getItem("sportsai_fav_v1")||"[]"
 );
 if(Array.isArray(saved))fav=saved;
}catch(e){}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function taiwanDate(date){
 const p=new Intl.DateTimeFormat("en-US",{
  timeZone:"Asia/Taipei",
  year:"numeric",
  month:"2-digit",
  day:"2-digit"
 }).formatToParts(date);

 const a={};
 for(const x of p)a[x.type]=x.value;

 return a.year+"-"+a.month+"-"+a.day;
}

function chosen(){
 const [y,m,d]=taiwanDate(new Date())
  .split("-").map(Number);

 return new Date(
  Date.UTC(y,m-1,d+offset)
 ).toISOString().slice(0,10);
}

function twTime(d){
 return new Intl.DateTimeFormat("zh-TW",{
  timeZone:"Asia/Taipei",
  month:"2-digit",
  day:"2-digit",
  hour:"2-digit",
  minute:"2-digit",
  hour12:false
 }).format(new Date(d));
}

function name(c){
 const t=c?.team||{};
 return ZH[t.abbreviation]||
  t.displayName||"未知隊伍";
}

function logo(c){
 const t=c?.team||{};
 return t.logo||t.logos?.[0]?.href||"";
}

function gameState(g){
 const s=g.status?.type?.state;
 return s==="post"?"已完賽":
  s==="in"?"進行中":"尚未開賽";
}

function pctAmerican(v){
 if(v===null||v===undefined||v==="")
  return null;

 const n=Number(v);
 if(!Number.isFinite(n)||!n)return null;

 return n>0?100/(n+100):-n/(-n+100);
}

function oddsInfo(g,a,h){
 const o=g.competitions?.[0]?.odds?.[0];

 if(!o)return {
  sa:"待取得",sh:"待取得",
  away:"—",home:"—",
  source:"未提供",
  hasML:false
 };

 const ap=pctAmerican(
  o.awayTeamOdds?.moneyLine
 );
 const hp=pctAmerican(
  o.homeTeamOdds?.moneyLine
 );

 const total=ap!==null&&hp!==null?
  ap+hp:null;

 let sa="待取得";
 let sh="待取得";

 const detail=String(o.details||"").trim();
 const m=detail.match(
  /^([A-Z]{2,5})\s*([+-]\d+(?:\.\d+)?)$/i
 );

 if(m){
  const ab=m[1].toUpperCase();
  const pts=Number(m[2]);

  const ac=String(
   a.team?.abbreviation||""
  ).toUpperCase();

  const hc=String(
   h.team?.abbreviation||""
  ).toUpperCase();

  const fmt=n=>n>0?"+"+n:String(n);

  if(ab===ac){
   sa=fmt(pts);
   sh=fmt(-pts);
  }else if(ab===hc){
   sa=fmt(-pts);
   sh=fmt(pts);
  }
 }

 return {
  sa,sh,
  away:total?
   (ap/total*100).toFixed(1)+"%":"—",
  home:total?
   (hp/total*100).toFixed(1)+"%":"—",
  source:o.provider?.name||"ESPN",
  hasML:!!total,
  details:detail
 };
}

// 取得 ESPN 提供的當季 W-L 戰績。
// 不使用虛構資料補足缺少的戰績。
function record(c){
 const rs=c.records||[];

 const r=rs.find(x=>
  x.type==="total"||
  x.type==="overall"||
  x.name==="overall"
 );

 const summary=r?.summary||"";
 const m=summary.match(/^(\d+)-(\d+)$/);

 if(!m)return null;

 const w=Number(m[1]);
 const l=Number(m[2]);
 const n=w+l;

 if(n<5)return null;

 return {w,l,n,p:w/n};
}

// 尚未校準的簡易模型：
// 戰績差乘以 0.65，主場固定 +0.04。
// 這不是經過驗證的 AI 或投注勝率。
function model(a,h){
 const ar=record(a);
 const hr=record(h);

 if(!ar||!hr)return null;

 const raw=0.5+
  (hr.p-ar.p)*0.65+0.04;

 const home=Math.max(
  0.15,Math.min(0.85,raw)
 );

 return {
  home,
  away:1-home,
  ar,hr
 };
}

function stage(g){
 const ms=new Date(g.date)-new Date();
 const hours=ms/3600000;

 if(gameState(g)!=="尚未開賽")
  return "比賽已開始／完賽";

 if(hours>12)return "提前研究階段";
 if(hours>2)return "賽前 12 小時內";
 if(hours>0.5)return "賽前 2 小時內";

 return "開賽前最後確認";
}

function teamBlock(c,played){
 const image=logo(c);

 return `
 <div class="team">
 ${image?
  `<img src="${esc(image)}"
    alt="${esc(name(c))}隊徽"
    loading="lazy">`:""}
 <div>${esc(name(c))}</div>
 <small>
 ${esc(c.team?.abbreviation||"")}
 · ${c.homeAway==="home"?"主":"客"}
 </small>
 ${played?
  `<div class="score">
   ${esc(c.score??"—")}
   </div>`:""}
 </div>`;
}

function predictionBlock(a,h,m,g){
 if(gameState(g)!=="尚未開賽"){
  return `
  <div class="prediction">
   <div class="top">
    <b>模型紀錄</b>
    <span>比賽已開始／完賽</span>
   </div>
   <p class="muted">
    不使用比賽開始後取得的戰績
    偽造賽前預測。
   </p>
  </div>`;
 }

 if(!m){
  return `
  <div class="prediction">
   <div class="top">
    <b>初步模型勝率</b>
    <span>${esc(stage(g))}</span>
   </div>
   <p class="muted">
    兩隊尚未都有至少五場可讀取的
    當季正式戰績，暫不公布模型勝率。
   </p>
  </div>`;
 }

 const away=(m.away*100).toFixed(1);
 const home=(m.home*100).toFixed(1);

 return `
 <div class="prediction">
  <div class="top">
   <b>初步模型勝率</b>
   <span>${esc(stage(g))}</span>
  </div>

  <div class="prob">
   <div>
    <small>${esc(name(a))}</small>
    <b>${away}%</b>
   </div>
   <div>
    <small>${esc(name(h))}</small>
    <b>${home}%</b>
   </div>
  </div>

  <div class="bar">
   <span style="width:${away}%"></span>
   <span style="width:${home}%"></span>
  </div>

  <p class="muted">
   戰績：
   ${esc(name(a))} ${m.ar.w}-${m.ar.l}；
   ${esc(name(h))} ${m.hr.w}-${m.hr.l}。
   僅為簡易戰績與主場模型，
   尚未納入傷兵、先發、對戰情況，
   也沒有完成歷史校準。
  </p>
 </div>`;
}

function card(g){
 const c=g.competitions?.[0]?.competitors||[];

 const a=c.find(x=>x.homeAway==="away");
 const h=c.find(x=>x.homeAway==="home");

 if(!a||!h)return "";

 const o=oddsInfo(g,a,h);
 const played=gameState(g)!=="尚未開賽";
 const m=model(a,h,g);

 let summary="已取得賽程與球隊資訊。";

 if(played){
  summary=
   "本場已開始或完賽，不使用賽後資訊倒推賽前結果。";
 }else if(m){
  const leader=m.home>=m.away?
   name(h):name(a);

  summary=
   "簡易戰績模型目前偏向"+
   leader+
   "，但尚未查核關鍵傷兵與預計先發，"+
   "這不是正式投注推薦。";
 }else{
  summary=
   "當季有效戰績樣本不足，暫不公布模型勝率。";
 }

 if(!played){
  summary+=
   " 讓分過盤機率尚未建立可靠模型，"+
   "維持待分析。";
 }

 return `
 <article class="card">
  <div class="cardhead">
   NBA｜${esc(gameState(g))}
   · ${esc(twTime(g.date))}
  </div>

  <div class="content">
   <div class="teams">
    ${teamBlock(a,played)}
    <span class="vs">VS</span>
    ${teamBlock(h,played)}
   </div>

   ${predictionBlock(a,h,m,g)}

   <div class="market">
    <div class="lab">隊伍</div>
    <div class="lab">獨贏市場機率</div>
    <div class="lab">讓分</div>

    <div>${esc(name(a))}</div>
    <div>${esc(o.away)}</div>
    <div>${esc(o.sa)}</div>

    <div>${esc(name(h))}</div>
    <div>${esc(o.home)}</div>
    <div>${esc(o.sh)}</div>
   </div>

   <div class="note">
    <strong>AI 分析摘要｜研究版</strong>
    ${esc(summary)}
   </div>

   <div class="foot">
    盤口來源：${esc(o.source)}<br>
    來源盤口時間未驗證。<br>
    市場機率與模型勝率分開計算。<br>
    傷兵／先發：尚未接入可靠來源。<br>
    讓分過盤機率：待驗證。<br>
    ${o.details?
     "盤口原文："+esc(o.details):""}
   </div>

   <div class="actionrow">
    <button data-fav="${esc(g.id)}">
     ${fav.includes(g.id)?
      "★ 已收藏":"☆ 收藏"}
    </button>
   </div>
  </div>
 </article>`;
}

function render(){
 const labels={
  home:"NBA 賽事分析",
  scores:"NBA 比分",
  schedule:"NBA 賽程",
  favs:"我的收藏",
  mine:"我的設定"
 };

 $("title").textContent=labels[page];
 $("dateLabel").textContent=
  chosen()+" · 台灣日期";

 $("settings").classList.toggle(
  "hidden",page!=="mine"
 );

 $("cards").classList.toggle(
  "hidden",page==="mine"
 );

 $("search").classList.toggle(
  "hidden",page==="mine"
 );

 document.querySelectorAll("nav button")
  .forEach(b=>{
   b.classList.toggle(
    "active",b.dataset.page===page
   );
  });

 const q=$("search").value.toLowerCase().trim();

 const list=games.filter(g=>{
  const c=g.competitions?.[0]?.competitors||[];

  const match=c.some(x=>
   (name(x)+" "+(x.team?.abbreviation||""))
    .toLowerCase().includes(q)
  );

  return match &&
   (page!=="favs"||fav.includes(g.id)) &&
   (page!=="scores"||
    g.status?.type?.state!=="pre");
 });

 $("count").textContent=
  page==="mine"?"設定":list.length+" 場";

 $("cards").innerHTML=page==="mine"?"":(
  list.map(card).join("")||
  '<div class="empty">沒有符合條件的賽事</div>'
 );
}

async function fetchDay(day){
 const ctl=new AbortController();
 const timer=setTimeout(()=>ctl.abort(),15000);

 try{
  const r=await fetch(
   API+day.replace(/-/g,""),
   {
    signal:ctl.signal,
    cache:"no-store"
   }
  );

  if(!r.ok)throw Error("HTTP "+r.status);

  return (await r.json()).events||[];
 }finally{
  clearTimeout(timer);
 }
}

async function load(){
 const id=++request;
 const date=chosen();

 const prior=new Date(
  new Date(date+"T00:00:00Z").getTime()
  -86400000
 ).toISOString().slice(0,10);

 $("status").textContent=
  "正在更新 ESPN NBA 資料…";

 const results=await Promise.allSettled([
  fetchDay(prior),
  fetchDay(date)
 ]);

 if(id!==request)return;

 if(results.every(
  r=>r.status==="rejected"
 )){
  $("status").textContent=
   "資料連線失敗。"+
   (lastUpdated?
    "目前顯示上次成功讀取的資料。":"")+
   "請稍後重新整理。";
  render();
  return;
 }

 const map=new Map();

 for(const r of results){
  if(r.status!=="fulfilled")continue;

  for(const g of r.value){
   if(
    g.id&&g.date&&
    taiwanDate(new Date(g.date))===date
   ){
    map.set(g.id,g);
   }
  }
 }

 games=[...map.values()].sort(
  (a,b)=>new Date(a.date)-new Date(b.date)
 );

 lastUpdated=new Date();

 const partial=results.some(
  r=>r.status==="rejected"
 );

 $("status").textContent=
  "資料讀取時間："+twTime(lastUpdated)+
  " · ESPN"+
  (partial?"（部分資料讀取失敗）":"")+
  "。初步模型於頁面重新載入資料時更新。";

 render();
}

$("prev").onclick=()=>{
 offset--;
 load();
};

$("next").onclick=()=>{
 offset++;
 load();
};

$("today").onclick=()=>{
 offset=0;
 load();
};

$("refresh").onclick=load;
$("search").oninput=render;

document.querySelectorAll("nav button")
 .forEach(b=>{
  b.onclick=()=>{
   page=b.dataset.page;
   render();
   window.scrollTo(0,0);
  };
 });

$("cards").onclick=e=>{
 const b=e.target.closest("[data-fav]");
 if(!b)return;

 const id=b.dataset.fav;

 fav=fav.includes(id)?
  fav.filter(x=>x!==id):
  [...fav,id];

 try{
  localStorage.setItem(
   "sportsai_fav_v1",
   JSON.stringify(fav)
  );
 }catch(e){}

 render();
};

$("clear").onclick=()=>{
 if(confirm("確定清空收藏？")){
  fav=[];
  try{
   localStorage.removeItem(
    "sportsai_fav_v1"
   );
  }catch(e){}
  render();
 }
};
