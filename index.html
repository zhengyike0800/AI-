
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e19">
<title>Sports AI v0.3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090e19;color:#f5f6fb;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:25px 18px 18px;background:linear-gradient(130deg,#222b43,#090e19)}
.logo{font-size:29px;font-weight:900}
.logo b{color:#ff3655}
.sub,.muted{color:#a5b3ca;font-size:12px;line-height:1.6}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#4e1c31;color:#ffc2cc;border-radius:30px;padding:8px 11px;font-size:12px}
main{max-width:670px;margin:auto;padding:18px 14px 120px}
h2{font-size:21px;margin:6px 0}
h3{margin:10px 0}
button{font:inherit;border:0;color:#dfe5f1;background:#202c40;border-radius:11px;padding:11px 12px;cursor:pointer}
button.active,.primary{color:white;background:linear-gradient(120deg,#ff3655,#ad1534)}
.bar{display:flex;gap:7px;margin:13px 0}
.bar button{flex:1;font-size:13px}
nav{position:fixed;z-index:4;bottom:0;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#101a2a;border-top:1px solid #304057;padding:7px 2px max(12px,env(safe-area-inset-bottom))}
nav button{background:none;padding:6px 1px;font-size:11px;color:#9ba9c0;line-height:1.8}
nav button.active{background:none;color:#ff526e}
nav .ico{display:block;font-size:21px}
.status{background:#151f30;border:1px solid #344660;border-radius:12px;padding:12px;color:#bfccdc;font-size:12px;line-height:1.7;margin:13px 0}
.card{background:linear-gradient(145deg,#19263a,#111929);border:1px solid #30415a;border-radius:17px;padding:15px;margin:12px 0}
.teams{display:flex;justify-content:space-around;align-items:center;gap:8px;margin:16px 0}
.team{width:42%;text-align:center;font-size:16px;font-weight:700}
.team img{width:62px;height:62px;display:block;object-fit:contain;margin:0 auto 7px}
.vs{color:#95a1b5;font-size:12px}
.score{font-size:23px;font-weight:800;color:#ff526e;margin-top:6px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.metric{background:#202d41;border-radius:10px;padding:10px 4px;text-align:center}
.metric strong{display:block;font-size:14px}
.metric small{color:#9eabc0;font-size:10px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1;font-size:13px}
.search{width:100%;color:white;background:#202b3d;border:1px solid #38475d;border-radius:10px;padding:12px;font-size:16px}
.hidden{display:none!important}
.empty{padding:22px;text-align:center;color:#a5b3ca}
</style>
</head>
<body>
<header>
<div class="row">
<div>
<div class="logo">賽事 <b>AI</b></div>
<div class="sub">SPORTS INTELLIGENCE · NBA</div>
</div>
<span class="pill">🇹🇼 台灣時間</span>
</div>
</header>

<main>
<div class="row">
<div>
<h2 id="heading">NBA 賽事中心</h2>
<div class="muted" id="dateLabel"></div>
</div>
<span class="pill" id="count">— 場</span>
</div>

<div class="bar" id="marketBar">
<button class="active" data-market="PK">PK 盤</button>
<button data-market="讓分">讓分盤</button>
<button data-market="大小">大小分</button>
</div>

<div class="bar">
<button id="prev">◀ 前一天</button>
<button id="today">今天</button>
<button id="next">後一天 ▶</button>
<button id="refresh">⟳</button>
</div>

<input class="search" id="search" placeholder="搜尋隊名、縮寫">

<div class="status" id="status">正在讀取 NBA 資料…</div>
<div id="games"></div>

<div id="personal" class="hidden">
<div class="card">
<h3>我的 Sports AI</h3>
<p class="muted">v0.3 · 紅黑色 NBA 賽事中心</p>
<p class="muted">
收藏記錄保存在目前瀏覽器。
比分與賽程由 ESPN 非官方公開介面提供。
勝率模型、傷兵與真實盤口尚未串接。
</p>
<button id="clearFav">清空收藏</button>
</div>
</div>

<p class="muted">
資料可能延遲。頁面開啟時每五分鐘嘗試更新。
未開賽不會以 0：0 顯示。
</p>
</main>

<nav id="nav">
<button data-page="home" class="active">
<span class="ico">⌂</span>首頁
</button>
<button data-page="scores">
<span class="ico">▥</span>比分
</button>
<button data-page="schedule">
<span class="ico">▦</span>賽事
</button>
<button data-page="favs">
<span class="ico">☆</span>收藏
</button>
<button data-page="mine">
<span class="ico">♙</span>我的
</button>
</nav>

<script>
const API="https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=";

const TW={
ATL:"老鷹",BOS:"塞爾提克",BKN:"籃網",
BRK:"籃網",CHA:"黃蜂",CHI:"公牛",
CLE:"騎士",DAL:"獨行俠",DEN:"金塊",
DET:"活塞",GS:"勇士",GSW:"勇士",
HOU:"火箭",IND:"溜馬",LAC:"快艇",
LAL:"湖人",MEM:"灰熊",MIA:"熱火",
MIL:"公鹿",MIN:"灰狼",NO:"鵜鶘",
NOP:"鵜鶘",NY:"尼克",NYK:"尼克",
OKC:"雷霆",ORL:"魔術",PHI:"76人",
PHX:"太陽",POR:"拓荒者",SA:"馬刺",
SAS:"馬刺",SAC:"國王",TOR:"暴龍",
UTA:"爵士",WAS:"巫師",WSH:"巫師"
};

const $=id=>document.getElementById(id);

let offset=0;
let page="home";
let market="PK";
let games=[];
let favorites=[];
let requestID=0;

try{
favorites=JSON.parse(localStorage.getItem("sports_favs_v03")||"[]");
if(!Array.isArray(favorites))favorites=[];
}catch(e){favorites=[]}

function dateTW(date){
const f=new Intl.DateTimeFormat("en-US",{
timeZone:"Asia/Taipei",
year:"numeric",month:"2-digit",day:"2-digit"
});
const parts=f.formatToParts(date);
const o={};
parts.forEach(p=>o[p.type]=p.value);
return o.year+"-"+o.month+"-"+o.day;
}

function selectedDate(){
const a=dateTW(new Date()).split("-").map(Number);
return new Date(Date.UTC(a[0],a[1]-1,a[2]+offset))
.toISOString().slice(0,10);
}

function fmt(date){
return new Intl.DateTimeFormat("zh-TW",{
timeZone:"Asia/Taipei",
month:"2-digit",day:"2-digit",
hour:"2-digit",minute:"2-digit",hour12:false
}).format(new Date(date));
}

function safe(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}

function nameTW(x){
const t=x?.team||{};
return TW[t.abbreviation]||t.displayName||"未知隊伍";
}

function live(e){
return e.status?.type?.state==="in";
}

function ended(e){
return e.status?.type?.state==="post";
}

function statusText(e){
return ended(e)?"已完賽":live(e)?"進行中":"尚未開賽";
}

async function getEvents(d){
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),12000);
try{
const r=await fetch(API+d.replaceAll("-",""),{
signal:controller.signal
});
if(!r.ok)throw Error("HTTP "+r.status);
return (await r.json()).events||[];
}finally{
clearTimeout(timer);
}
}

async function load(){
const rid=++requestID;
const date=selectedDate();
const previous=new Date(
new Date(date+"T00:00:00Z").getTime()-86400000
).toISOString().slice(0,10);

$("dateLabel").textContent=date+" · 台灣日期";
$("status").textContent="正在連接 ESPN…";
$("games").innerHTML="";
$("count").textContent="讀取中";

try{
const results=await Promise.allSettled([
getEvents(previous),getEvents(date)
]);
if(rid!==requestID)return;

if(results.every(x=>x.status==="rejected")){
throw Error("資料來源無法連線");
}

const map=new Map();

for(const result of results){
if(result.status!=="fulfilled")continue;
for(const e of result.value){
if(e.id&&dateTW(new Date(e.date))===date){
map.set(e.id,e);
}
}
}

games=[...map.values()].sort(
(a,b)=>new Date(a.date)-new Date(b.date)
);

render();

const partial=results.some(x=>x.status==="rejected");
$("status").textContent=
"資料已更新："+fmt(new Date())+
" · ESPN"+(partial?"（部分來源失敗）":"");

}catch(err){
if(rid!==requestID)return;
games=[];
render();
$("status").textContent=
"連線失敗："+err.message+"，請按 ⟳ 再試。";
}
}

function card(e){
const c=e.competitions?.[0]?.competitors||[];
const away=c.find(x=>x.homeAway==="away");
const home=c.find(x=>x.homeAway==="home");
if(!away||!home)return "";

const played=live(e)||ended(e);

function side(x){
const t=x.team||{};
const logo=t.logo||t.logos?.[0]?.href||"";
return `
<div class="team">
${logo?`<img src="${safe(logo)}" alt="${safe(nameTW(x))}標誌" loading="lazy">`:""}
${safe(nameTW(x))}
<div class="muted">
${safe(t.abbreviation||"")} · ${x.homeAway==="home"?"主":"客"}
</div>
${played?`<div class="score">${safe(x.score??"-")}</div>`:""}
</div>`;
}

return `
<article class="card">
<div class="row">
<span class="pill">NBA · ${statusText(e)}</span>
<span class="muted">${fmt(e.date)}</span>
</div>
<div class="teams">
${side(away)}
<span class="vs">VS</span>
${side(home)}
</div>
<div class="metrics">
<div class="metric">
<strong>${safe(away.records?.[0]?.summary||"—")}</strong>
<small>客隊戰績</small>
</div>
<div class="metric">
<strong>${safe(home.records?.[0]?.summary||"—")}</strong>
<small>主隊戰績</small>
</div>
<div class="metric">
<strong>待分析</strong>
<small>${market==="PK"?"勝負":market==="讓分"?"讓分":"總分"}預測</small>
</div>
</div>
<div class="actions">
<button data-fav="${safe(e.id)}">
${favorites.includes(e.id)?"★ 已收藏":"☆ 收藏"}
</button>
<button class="primary" data-detail="${safe(e.id)}">
分析詳情
</button>
</div>
</article>`;
}

function render(){
document.querySelectorAll("#nav button").forEach(b=>{
b.classList.toggle("active",b.dataset.page===page);
});

$("personal").classList.toggle("hidden",page!=="mine");
$("games").classList.toggle("hidden",page==="mine");
$("search").classList.toggle("hidden",page==="mine");
$("marketBar").classList.toggle("hidden",page==="mine");

const titles={
home:"NBA 賽事分析",
scores:"NBA 即時比分",
schedule:"NBA 賽程",
favs:"我的收藏",
mine:"個人設定"
};
$("heading").textContent=titles[page];

const q=$("search").value.trim().toLowerCase();

const list=games.filter(e=>{
const c=e.competitions?.[0]?.competitors||[];
const match=c.some(x=>
(nameTW(x)+" "+(x.team?.abbreviation||""))
.toLowerCase().includes(q)
);
return match
&&(page!=="favs"||favorites.includes(e.id))
&&(page!=="scores"||live(e)||ended(e));
});

$("count").textContent=page==="mine"?"設定":list.length+" 場";

$("games").innerHTML=page==="mine"?"":(
list.map(card).join("")||
'<p class="empty">這個日期沒有符合條件的賽事。</p>'
);
}

document.querySelectorAll("#nav button").forEach(b=>{
b.onclick=()=>{
page=b.dataset.page;
render();
window.scrollTo(0,0);
};
});

document.querySelectorAll("#marketBar button").forEach(b=>{
b.onclick=()=>{
market=b.dataset.market;
document.querySelectorAll("#marketBar button").forEach(x=>{
x.classList.toggle("active",x===b);
});
render();
};
});

$("prev").onclick=()=>{offset--;load()};
$("today").onclick=()=>{offset=0;load()};
$("next").onclick=()=>{offset++;load()};
$("refresh").onclick=load;
$("search").oninput=render;

$("games").onclick=e=>{
const fav=e.target.closest("[data-fav]");
if(fav){
const id=fav.dataset.fav;
favorites=favorites.includes(id)
?favorites.filter(x=>x!==id)
:[...favorites,id];
try{
localStorage.setItem("sports_favs_v03",JSON.stringify(favorites));
}catch(e){}
render();
return;
}

const detail=e.target.closest("[data-detail]");
if(detail){
const g=games.find(x=>x.id===detail.dataset.detail);
if(!g)return;
const c=g.competitions?.[0]?.competitors||[];
alert(
"賽事："+c.map(nameTW).join(" VS ")+
"\n開賽："+fmt(g.date)+
"\n目前尚無可靠的 AI 勝率與真實盤口。"
);
}
};

$("clearFav").onclick=()=>{
if(confirm("確定清空收藏？")){
favorites=[];
try{localStorage.removeItem("sports_favs_v03")}catch(e){}
render();
}
};

load();
setInterval(()=>{
if(!document.hidden)load();
},300000);
</script>
  
<!-- Sports AI v0.4 勝率分析擴充 -->
<style>
.analysis-v4{
 margin-top:14px;
 padding:14px;
 border:1px solid #553047;
 border-radius:13px;
 background:#1b2032;
}
.analysis-v4 h4{
 margin:0 0 10px;
 color:#ff657e;
 font-size:15px;
}
.prob-bar{
 display:flex;
 height:10px;
 overflow:hidden;
 border-radius:20px;
 background:#344052;
 margin:11px 0;
}
.prob-away{background:#ff3655}
.prob-home{background:#64748b}
.prob-values{
 display:flex;
 justify-content:space-between;
 font-weight:bold;
 font-size:17px;
}
.prob-note{
 color:#aebbd0;
 font-size:11px;
 line-height:1.7;
 margin-top:10px;
}
.ev-button{
 width:100%;
 background:#512137;
 color:#ffcad3;
 margin-top:12px;
}
</style>

<script>
(function(){
"use strict";

function recordOf(x){
 const text=x?.records?.[0]?.summary||"";
 const m=/^(\d+)-(\d+)$/.exec(text);
 if(!m)return null;

 const w=Number(m[1]);
 const l=Number(m[2]);
 return {w,l,n:w+l};
}

function calculate(e){
 if(e.status?.type?.state!=="pre")return null;

 const teams=e.competitions?.[0]?.competitors||[];
 const away=teams.find(x=>x.homeAway==="away");
 const home=teams.find(x=>x.homeAway==="home");

 if(!away||!home)return null;

 const a=recordOf(away);
 const h=recordOf(home);

 if(!a||!h||a.n<5||h.n<5)return null;

 // 貝氏平滑：避免開季少量戰績過度影響結果
 const ap=(a.w+5)/(a.n+10);
 const hp=(h.w+5)/(h.n+10);

 // 教學模型：戰績差異＋主場修正 2.5 個百分點
 const homeP=Math.max(.35,Math.min(.65,
   .5+(hp-ap)*.9+.025
 ));
 const awayP=1-homeP;

 return {
  away:awayP,
  home:homeP,
  awayName:nameTW(away),
  homeName:nameTW(home),
  a,h
 };
}

function percent(x){
 return (x*100).toFixed(1)+"%";
}

const previousCard=card;

card=function(e){
 let html=previousCard(e);
 if(!html)return html;

 let result=calculate(e);
 let section="";

 if(e.status?.type?.state!=="pre"){
  section=`
  <div class="analysis-v4">
   <h4>歷史賽事</h4>
   <div class="prob-note">
   比賽已開始或結束，不使用賽後戰績倒推賽前預測。
   </div>
  </div>`;
 }else if(!result){
  section=`
  <div class="analysis-v4">
   <h4>勝率資料不足</h4>
   <div class="prob-note">
   雙方需各有至少 5 場已完成的戰績，
   才啟用 v0.4 試算模型。
   </div>
  </div>`;
 }else{
  const r=result;
  section=`
  <div class="analysis-v4">
   <h4>v0.4 戰績模型試算</h4>
   <div class="prob-values">
    <span>${percent(r.away)}</span>
    <span>${percent(r.home)}</span>
   </div>
   <div class="prob-bar">
    <div class="prob-away" style="width:${percent(r.away)}"></div>
    <div class="prob-home" style="width:${percent(r.home)}"></div>
   </div>
   <div class="prob-note">
   ${r.awayName}：${r.a.w} 勝 ${r.a.l} 敗<br>
   ${r.homeName}：${r.h.w} 勝 ${r.h.l} 敗<br>
   簡易模型包含戰績平滑及固定主場修正，
   未納入傷兵、球員效率和對手強度。
   </div>
   <button class="ev-button" data-ev="${e.id}">
    試算十進位賠率 EV
   </button>
  </div>`;
 }

 return html.replace("</article>",section+"</article>");
};

const previousRender=render;

render=function(){
 previousRender();
};

document.getElementById("games").addEventListener("click",function(event){
 const btn=event.target.closest("[data-ev]");
 if(!btn)return;

 const e=games.find(x=>x.id===btn.dataset.ev);
 if(!e)return;

 const r=calculate(e);
 if(!r)return;

 const side=prompt(
  "選擇分析對象：輸入 1 為客隊，2 為主隊"
 );
 if(side!=="1"&&side!=="2")return;

 const oddsText=prompt("輸入十進位賠率，例如 1.85");
 if(oddsText===null)return;

 const odds=Number(oddsText);
 if(!Number.isFinite(odds)||odds<=1){
  alert("請輸入大於 1 的有效十進位賠率");
  return;
 }

 const p=side==="1"?r.away:r.home;
 const ev=(p*odds-1)*100;
 const breakEven=100/odds;

 alert(
  "模型試算勝率："+percent(p)+
  "\n賠率："+odds.toFixed(2)+
  "\n損益兩平勝率："+breakEven.toFixed(1)+"%"+
  "\n理論 EV："+ev.toFixed(2)+"%"+
  "\n\n注意：模型尚未驗證，EV 不代表真實獲利優勢。"
 );
});

render();
})();
</script>
<!-- Sports AI v0.4 END -->


<!-- Sports AI v0.5 近期戰績分析 -->
<style>
.form-v5{
 margin-top:12px;
 padding:14px;
 background:#171f31;
 border:1px solid #41445c;
 border-radius:13px;
}
.form-v5 h4{margin:0 0 12px;color:#ff657e}
.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}
.form-box{
 background:#253047;
 padding:12px;
 border-radius:10px;
 text-align:center;
}
.form-box strong{font-size:19px;display:block}
.form-box small{font-size:11px;color:#b1bdd0}
.form-info{font-size:12px;color:#c2ccda;line-height:1.9;margin-top:12px}
</style>
<script>
(function(){
"use strict";

const ESPN_MONTH="https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?limit=500&dates=";
const historyCache=new Map();
let history=[];
let historyState="正在載入近期比賽…";
let historyRequest=0;

function monthKeys(){
 const date=selectedDate();
 const [y,m]=date.split("-").map(Number);
 return [0,1,2].map(n=>{
  const d=new Date(Date.UTC(y,m-1-n,1));
  return d.toISOString().slice(0,7).replace("-","");
 });
}

async function monthGames(key){
 if(historyCache.has(key))return historyCache.get(key);
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),12000);
 try{
  const r=await fetch(ESPN_MONTH+key,{signal:controller.signal});
  if(!r.ok)throw Error("HTTP "+r.status);
  const data=await r.json();
  const items=data.events||[];
  historyCache.set(key,items);
  return items;
 }finally{clearTimeout(timer)}
}

async function updateHistory(){
 const id=++historyRequest;
 historyState="正在更新近期數據…";
 history=[];
 render();

 const results=await Promise.allSettled(
  monthKeys().map(monthGames)
 );
 if(id!==historyRequest)return;

 const map=new Map();
 results.forEach(r=>{
  if(r.status!=="fulfilled")return;
  r.value.forEach(g=>{
   if(g.id)map.set(g.id,g);
  });
 });
 history=[...map.values()];
 historyState=results.some(x=>x.status==="rejected")
  ?"部分月份無法取得，近期統計可能不完整"
  :"ESPN 已完成賽事統計";
 render();
}

function formFor(game,teamID){
 const target=new Date(game.date).getTime();
 const items=[];

 history.forEach(g=>{
  if(new Date(g.date).getTime()>=target)return;
  if(g.status?.type?.state!=="post")return;
  if(g.season?.type&&g.season.type!==2)return;

  const c=g.competitions?.[0]?.competitors||[];
  const own=c.find(x=>String(x.team?.id)===String(teamID));
  const other=c.find(x=>String(x.team?.id)!==String(teamID));
  if(!own||!other)return;

  const a=Number(own.score);
  const b=Number(other.score);
  if(!Number.isFinite(a)||!Number.isFinite(b))return;
  if(a===b)return;

  items.push({
   time:new Date(g.date).getTime(),
   win:a>b, scored:a,allowed:b,
   home:own.homeAway==="home"
  });
 });

 items.sort((a,b)=>b.time-a.time);
 const last5=items.slice(0,5);
 const last10=items.slice(0,10);

 function summarize(list){
  const wins=list.filter(x=>x.win).length;
  return {n:list.length,wins,losses:list.length-wins};
 }
 const s5=summarize(last5);
 const s10=summarize(last10);
 const avg=(k)=>last5.length
  ?(last5.reduce((n,x)=>n+x[k],0)/last5.length).toFixed(1)
  :"—";
 const home=items.filter(x=>x.home).slice(0,5);
 const away=items.filter(x=>!x.home).slice(0,5);
 const result=a=>a.length?a.filter(x=>x.win).length+"-"+a.filter(x=>!x.win).length:"—";

 return {
  s5,s10,scored:avg("scored"),allowed:avg("allowed"),
  home:result(home),away:result(away)
 };
}

const oldCardV5=card;

card=function(e){
 const html=oldCardV5(e);
 if(!html)return html;

 const teams=e.competitions?.[0]?.competitors||[];
 const a=teams.find(x=>x.homeAway==="away");
 const h=teams.find(x=>x.homeAway==="home");
 if(!a||!h)return html;

 if(historyState.startsWith("正在")){
  return html.replace("</article>",
   '<div class="form-v5"><h4>近期戰績</h4><div class="form-info">正在整理歷史賽事…</div></div></article>');
 }

 const A=formFor(e,a.team?.id);
 const H=formFor(e,h.team?.id);

 const cell=(x)=>`
 <div class="form-box">
  <strong>${x.s5.n?x.s5.wins+"-"+x.s5.losses:"資料不足"}</strong>
  <small>近5場戰績（已取得${x.s5.n}場）</small>
  <p>近10場：${x.s10.n?x.s10.wins+"-"+x.s10.losses:"—"}</p>
  <p>得分：${x.scored}</p>
  <p>失分：${x.allowed}</p>
  <p>主場：${x.home}</p>
  <p>客場：${x.away}</p>
 </div>`;

 const section=`
 <div class="form-v5">
  <h4>v0.5 近期表現比較</h4>
  <div class="form-grid">
   ${cell(A)}
   ${cell(H)}
  </div>
  <div class="form-info">
   左：${nameTW(a)}（客）｜右：${nameTW(h)}（主）<br>
   ${historyState}<br>
   只統計所取得、且早於本場比賽的已完賽結果。
   主客場數字為各自最近最多5場。
   最近5場與10場不足時使用實際取得場數，不補造數據。
  </div>
 </div>`;

 return html.replace("</article>",section+"</article>");
};

const originalLoadV5=load;
load=async function(){
 await originalLoadV5();
 await updateHistory();
};

updateHistory();
})();
</script>

<script>
(function(){
"use strict";

function readForm(box){
 if(!box)return null;

 const strong=box.querySelector("strong");
 const m=/^(\d+)-(\d+)$/.exec(
  strong?.textContent?.trim()||""
 );
 if(!m)return null;

 const wins=Number(m[1]);
 const losses=Number(m[2]);

 const text=box.textContent||"";
 const get=label=>{
  const match=text.match(
   new RegExp(label+"：\\s*([\\d.]+)")
  );
  return match?Number(match[1]):NaN;
 };

 return {
  wins,losses,n:wins+losses,
  scored:get("得分"),
  allowed:get("失分")
 };
}

function forecast(a,h){
 if(!a||!h||a.n<5||h.n<5)return null;

 if(![
  a.scored,a.allowed,h.scored,h.allowed
 ].every(Number.isFinite))return null;

 const ar=a.wins/a.n;
 const hr=h.wins/h.n;

 const an=a.scored-a.allowed;
 const hn=h.scored-h.allowed;

 // 實驗性公式，尚未歷史校準
 const recordDiff=(hr-ar)*0.12;
 const scoreDiff=(hn-an)*0.003;
 const homeAdjust=0.025;

 const homeP=Math.max(0.35,Math.min(0.65,
  0.5+recordDiff+scoreDiff+homeAdjust
 ));

 return {
  away:1-homeP,
  home:homeP,
  aNet:an,
  hNet:hn
 };
}

<script>
(function(){
"use strict";

const V7_API=
"https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?limit=500&dates=";

const baseMonths=[
"202510","202511","202512",
"202601","202602","202603","202604"
];

let modelV7=null;
let stateV7="正在讀取 Elo 歷史資料…";

const previousCardV7=card;

function gameData(e){
 if(e.status?.type?.state!=="post")return null;
 if(Number(e.season?.type)!==2)return null;

 const c=e.competitions?.[0]?.competitors||[];
 const a=c.find(x=>x.homeAway==="away");
 const h=c.find(x=>x.homeAway==="home");

 if(!a||!h)return null;

 const as=Number(a.score);
 const hs=Number(h.score);

 if(!Number.isFinite(as)||!Number.isFinite(hs))return null;
 if(as===hs)return null;

 return {
  id:e.id,
  time:new Date(e.date).getTime(),
  season:Number(e.season?.year)||0,
  away:String(a.team.id),
  home:String(h.team.id),
  homeWin:hs>as
 };
}

function probability(away,home){
 // Elo 主場優勢設定為 75 點
 return 1/(1+Math.pow(
  10,(away-home-75)/400
 ));
}

function eloBuild(events){
 const ratings=new Map();
 const counts=new Map();
 let season=0;
 let tested=0,correct=0,brier=0;
 let processed=0;

 const games=events.map(gameData)
  .filter(Boolean)
  .sort((a,b)=>a.time-b.time);

 const predictions=new Map();

 for(const g of games){
  if(g.season!==season){
   if(season){
    for(const [id,r] of ratings){
     ratings.set(id,1500+(r-1500)*0.75);
    }
   }
   season=g.season;
  }

  const ar=ratings.get(g.away)||1500;
  const hr=ratings.get(g.home)||1500;
  const p=probability(ar,hr);

  const an=counts.get(g.away)||0;
  const hn=counts.get(g.home)||0;

  // 只用當場比賽之前已完成的賽事
  if(processed>=150&&an>=8&&hn>=8){
   const outcome=g.homeWin?1:0;
   brier+=Math.pow(p-outcome,2);
   if((p>=0.5)===g.homeWin)correct++;
   tested++;
  }

  predictions.set(g.id,{
   home:p,away:1-p
  });

  const change=20*((g.homeWin?1:0)-p);

  ratings.set(g.home,hr+change);
  ratings.set(g.away,ar-change);
  counts.set(g.home,hn+1);
  counts.set(g.away,an+1);
  processed++;
 }

 return {
  ratings,counts,predictions,
  processed,tested,correct,
  brier:tested?brier/tested:null
 };
}

async function fetchV7Month(key){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),15000);
 try{
  const r=await fetch(V7_API+key,{
   signal:controller.signal
  });
  if(!r.ok)throw Error("HTTP "+r.status);
  const data=await r.json();
  return data.events||[];
 }finally{
  clearTimeout(timer);
 }
}

function monthsV7(){
 const now=selectedDate();
 const keys=[...baseMonths];

 const end=now.slice(0,7).replace("-","");
 for(let m=202610;m<=Number(end);){
  const year=Math.floor(m/100);
  const month=m%100;
  keys.push(String(m));
  m=month===12?(year+1)*100+1:m+1;
  if(keys.length>=20)break;
 }
 return [...new Set(keys)];
}

async function loadEloV7(){
 stateV7="正在建立 Elo 模型…";
 render();

 try{
  const keys=monthsV7();
  const response=await Promise.allSettled(
   keys.map(fetchV7Month)
  );

  // 避免歷史月份缺漏造成錯誤評級
  if(response.some(r=>r.status!=="fulfilled")){
   throw Error("有歷史月份讀取失敗");
  }

  const map=new Map();
  response.forEach(r=>{
   r.value.forEach(e=>{
    if(e.id)map.set(e.id,e);
   });
  });

  const events=[...map.values()];
  const candidate=eloBuild(events);

  if(candidate.processed<800){
   throw Error("歷史比賽不足 800 場");
  }

  modelV7=candidate;
  stateV7="Elo 歷史模型已建立";
 }catch(e){
  modelV7=null;
  stateV7="Elo 尚不可用："+e.message;
 }

 render();
}

function predictionV7(e){
 if(!modelV7)return null;
 if(e.status?.type?.state!=="pre")return null;

 const c=e.competitions?.[0]?.competitors||[];
 const a=c.find(x=>x.homeAway==="away");
 const h=c.find(x=>x.homeAway==="home");

 if(!a||!h)return null;

 const aid=String(a.team.id);
 const hid=String(h.team.id);

 const ar=modelV7.ratings.get(aid);
 const hr=modelV7.ratings.get(hid);

 if(!Number.isFinite(ar)||!Number.isFinite(hr))return null;

 if((modelV7.counts.get(aid)||0)<8 ||
    (modelV7.counts.get(hid)||0)<8)return null;

 const p=probability(ar,hr);

 return {
  home:p,away:1-p,
  ar,hr
 };
}

card=function(e){
 const html=previousCardV7(e);
 if(!html)return html;

 const root=document.createElement("div");
 root.innerHTML=html;
 const article=root.querySelector("article");
 if(!article)return html;

 const box=document.createElement("section");
 box.className="elo-v7";

 const p=predictionV7(e);

 if(!p){
  box.innerHTML=`
   <h4>v0.7 Elo 勝率研究</h4>
   <p>${stateV7}</p>
   <p>模型只對尚未開賽、資料完整的場次
   提供實驗性勝率。</p>`;
 }else{
  const away=(p.away*100).toFixed(1);
  const home=(p.home*100).toFixed(1);

  const tested=modelV7.tested;
  const hit=tested?
   (modelV7.correct/tested*100).toFixed(1)+"%":"—";
  const bs=modelV7.brier===null?
   "—":modelV7.brier.toFixed(4);

  box.innerHTML=`
   <h4>v0.7 Elo 賽前勝率試算</h4>
   <div class="numbers">
    <span>客 ${away}%</span>
    <span>主 ${home}%</span>
   </div>
   <div class="progress">
    <span style="width:${away}%"></span>
   </div>
   <p>
    客隊 Elo：${p.ar.toFixed(0)}<br>
    主隊 Elo：${p.hr.toFixed(0)}
   </p>
   <details>
    <summary>查看歷史模型表現</summary>
    <p>
     歷史評估場次：${tested}<br>
     預測方向命中率：${hit}<br>
     Brier Score：${bs}<br>
     Brier 越低越好，需與基準模型比較。
    </p>
    <p>
     歷史評估採逐場更新的方式，
     不使用當場的比賽結果計算該場預測。
     這不是獨立樣本外驗證。
    </p>
   </details>
   <p>
    此為實驗性 Elo 模型，
    尚未納入傷兵、陣容異動、休息日等因素。
    不能保證預測準確，也不代表投注優勢。
   </p>`;
 }

 article.appendChild(box);
 return article.outerHTML;
};

// 優先建立 Elo，不改動原本的賽程連線
loadEloV7();
})();
</script>
