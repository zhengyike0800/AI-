<script>
"use strict";

const $=id=>document.getElementById(id);

const SCORE=
"https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=";

const TABLE=
"https://site.api.espn.com/apis/v2/sports/basketball/nba/standings?season=";

const ZH={
 ATL:"老鷹",BOS:"塞爾提克",
 BKN:"籃網",BRK:"籃網",CHA:"黃蜂",
 CHI:"公牛",CLE:"騎士",DAL:"獨行俠",
 DEN:"金塊",DET:"活塞",GS:"勇士",
 GSW:"勇士",HOU:"火箭",IND:"溜馬",
 LAC:"快艇",LAL:"湖人",MEM:"灰熊",
 MIA:"熱火",MIL:"公鹿",MIN:"灰狼",
 NO:"鵜鶘",NOP:"鵜鶘",NY:"尼克",
 NYK:"尼克",OKC:"雷霆",ORL:"魔術",
 PHI:"76人",PHX:"太陽",POR:"拓荒者",
 SA:"馬刺",SAS:"馬刺",SAC:"國王",
 TOR:"暴龍",UTA:"爵士",UTAH:"爵士",
 WAS:"巫師",WSH:"巫師"
};

let offset=0,page="home",games=[],request=0;
let prevData=new Map(),nowData=new Map();
let lastUpdated=null, fav=[];

try{
 const saved=JSON.parse(
  localStorage.getItem("sportsai_fav_v1")||"[]"
 );
 if(Array.isArray(saved))fav=saved;
}catch(e){}

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function dateTW(d){
 const p=new Intl.DateTimeFormat("en-US",{
  timeZone:"Asia/Taipei",year:"numeric",
  month:"2-digit",day:"2-digit"
 }).formatToParts(d);
 const a={};
 p.forEach(x=>a[x.type]=x.value);
 return a.year+"-"+a.month+"-"+a.day;
}

function selected(){
 const [y,m,d]=dateTW(new Date()).split("-").map(Number);
 return new Date(Date.UTC(y,m-1,d+offset))
  .toISOString().slice(0,10);
}

function timeTW(v){
 return new Intl.DateTimeFormat("zh-TW",{
  timeZone:"Asia/Taipei",
  month:"2-digit",day:"2-digit",
  hour:"2-digit",minute:"2-digit",
  hour12:false
 }).format(new Date(v));
}

function teamName(c){
 return ZH[c?.team?.abbreviation]||
  c?.team?.displayName||"未知球隊";
}

function state(g){
 const s=g.status?.type?.state;
 return s==="post"?"已完賽":
  s==="in"?"進行中":"尚未開賽";
}

async function getJSON(url){
 const ctrl=new AbortController();
 const timer=setTimeout(()=>ctrl.abort(),15000);
 try{
  const r=await fetch(url,{
   cache:"no-store",signal:ctrl.signal
  });
  if(!r.ok)throw Error("HTTP "+r.status);
  return await r.json();
 }finally{clearTimeout(timer)}
}

function getStat(stats,keys){
 const s=(stats||[]).find(x=>
  keys.includes(String(x.name||"").toLowerCase())||
  keys.includes(String(x.abbreviation||"").toLowerCase())
 );
 if(!s)return null;
 const n=Number(s.value??s.displayValue);
 return Number.isFinite(n)?n:null;
}

function parseTable(data){
 const map=new Map();

 function walk(node){
  if(!node||typeof node!=="object")return;
  if(Array.isArray(node)){
   node.forEach(walk);return;
  }

  for(const e of node.entries||[]){
   const t=e.team||{};
   const s=e.stats||[];

   const w=getStat(s,["wins","w"]);
   const l=getStat(s,["losses","l"]);

   const pf=getStat(s,[
    "avgpointsfor","avg points for",
    "avg_points_for"
   ]);
   const pa=getStat(s,[
    "avgpointsagainst","avg points against",
    "avg_points_against"
   ]);

   const diffTotal=getStat(s,[
    "pointdifferential","point differential",
    "point_differential","differential"
   ]);

   if(!t.id||w===null||l===null)continue;
   const n=w+l;

   let margin=null;

   if(pf!==null&&pa!==null){
    margin=pf-pa;
   }else if(diffTotal!==null&&n>0){
    margin=diffTotal/n;
   }

   map.set(String(t.id),{
    w,l,n,p:n?w/n:0.5,
    margin
   });
  }

  walk(node.children);
  if(node.standings)walk(node.standings);
 }
 walk(data);
 return map;
}

function seasonYear(date){
 const [y,m]=date.split("-").map(Number);
 return m>=10?y+1:y;
}

function record(c,map){
 return map.get(String(c.team?.id||""))||null;
}

function blend(old,now,key){
 const prior=12;
 const valid=now?.n||0;
 return (
  old[key]*prior+
  (now&&Number.isFinite(now[key])?
   now[key]*valid:old[key]*valid)
 )/(prior+valid);
}

// 研究用獨贏模型
function winModel(a,h){
 const ap=record(a,prevData);
 const hp=record(h,prevData);
 if(!ap||!hp||ap.n<20||hp.n<20)return null;

 const ac=record(a,nowData);
 const hc=record(h,nowData);

 const away=blend(ap,ac,"p");
 const home=blend(hp,hc,"p");

 const p=1/(1+Math.exp(
  -(2.4*(home-away)+0.12)
 ));

 return {home:p,away:1-p};
}

// 標準常態分布累積機率的近似值
function normalCDF(z){
 const x=Math.abs(z);
 const t=1/(1+0.2316419*x);
 const d=0.3989422804*Math.exp(-x*x/2);
 const tail=d*t*(
  0.319381530+t*(-0.356563782+
  t*(1.781477937+t*(-1.821255978+
  t*1.330274429)))
 );
 return z>=0?1-tail:tail;
}

// 研究用讓分模型：預測主隊分差。
// 主場 +2.5 分、標準差 12 分是模型假設，
// 並非經過歷史驗證的 NBA 固定值。
function spreadModel(a,h,homeSpread){
 const ap=record(a,prevData);
 const hp=record(h,prevData);
 if(!ap||!hp||
    !Number.isFinite(ap.margin)||
    !Number.isFinite(hp.margin))return null;

 const ac=record(a,nowData);
 const hc=record(h,nowData);

 const aMargin=blend(ap,ac,"margin");
 const hMargin=blend(hp,hc,"margin");

 const expected=(hMargin-aMargin)/2+2.5;
 const homeCover=normalCDF(
  (expected+homeSpread)/12
 );

 return {
  home:homeCover,
  away:1-homeCover,
  expected
 };
}

function market(g,a,h){
 const o=g.competitions?.[0]?.odds?.[0];
 const detail=String(o?.details||"").trim();
 const m=detail.match(
  /^([A-Z]{2,5})\s*([+-]\d+(?:\.\d+)?)$/i
 );

 let awayLine=null,homeLine=null;

 if(m){
  const code=m[1].toUpperCase();
  const n=Number(m[2]);
  const ac=String(a.team?.abbreviation||"").toUpperCase();
  const hc=String(h.team?.abbreviation||"").toUpperCase();

  if(code===ac){
   awayLine=n;homeLine=-n;
  }else if(code===hc){
   homeLine=n;awayLine=-n;
  }
 }

 return {
  awayLine,homeLine,
  source:o?.provider?.name||"未提供"
 };
}

function fmtLine(v){
 if(v===null||!Number.isFinite(v))return "—";
 return v>0?"+"+v:String(v);
}

function fmtP(v){
 if(v===null||!Number.isFinite(v))return "待計算";
 return (100*v).toFixed(1)+"%";
}

function teamBox(c,played){
 const t=c.team||{};
 const image=t.logo||t.logos?.[0]?.href;

 return `
 <div class="team">
 ${image?`<img src="${esc(image)}"
 alt="${esc(teamName(c))}隊徽">`:""}
 <div class="teamname">${esc(teamName(c))}</div>
 <small>${esc(t.abbreviation||"")}
 · ${c.homeAway==="home"?"主":"客"}</small>
 ${played?`<div class="score">
 ${esc(c.score??"—")}</div>`:""}
 </div>`;
}

function gameCard(g){
 const c=g.competitions?.[0]?.competitors||[];
 const a=c.find(x=>x.homeAway==="away");
 const h=c.find(x=>x.homeAway==="home");
 if(!a||!h)return "";

 const played=state(g)!=="尚未開賽";
 const o=market(g,a,h);

 // 已開始的比賽不重新偽造賽前勝率
 const w=played?null:winModel(a,h);

 const s=played||o.homeLine===null?
  null:spreadModel(a,h,o.homeLine);

 let summary;

 if(played){
  summary="比賽已開始或完賽，停止產生新的賽前預測。";
 }else if(w&&s){
  const winPick=w.home>w.away?teamName(h):teamName(a);
  const coverPick=s.home>s.away?teamName(h):teamName(a);
  summary="獨贏初步模型偏向"+winPick+
   "；讓分研究模型偏向"+coverPick+
   "。傷兵與先發尚未核實，預測可能調整。";
 }else if(w){
  summary="已有獨贏模型，但讓分盤口或分差資料不足，"+
   "暫不公布過盤機率。";
 }else{
  summary="目前缺少模型所需的有效歷史資料，"+
   "暫不公布勝率。";
 }

 return `
 <article class="card">
  <div class="cardhead">
   NBA · ${esc(timeTW(g.date))}
   · ${esc(state(g))}
  </div>
  <div class="content">
   <div class="teams">
    ${teamBox(a,played)}
    <div class="vs">VS</div>
    ${teamBox(h,played)}
   </div>

   <table class="metrics">
    <thead>
     <tr>
      <th>項目</th>
      <th>${esc(teamName(a))}</th>
      <th>${esc(teamName(h))}</th>
     </tr>
    </thead>
    <tbody>
     <tr>
      <td>獨贏勝率</td>
      <td class="big">${fmtP(w?.away??null)}</td>
      <td class="big">${fmtP(w?.home??null)}</td>
     </tr>
     <tr>
      <td>真實讓分</td>
      <td>${fmtLine(o.awayLine)}</td>
      <td>${fmtLine(o.homeLine)}</td>
     </tr>
     <tr>
      <td>讓分勝率</td>
      <td class="big">${fmtP(s?.away??null)}</td>
      <td class="big">${fmtP(s?.home??null)}</td>
     </tr>
    </tbody>
   </table>

   
   <details class="analysis">
    <summary>🧠 查看 AI 分析</summary>
    <div style="margin-top:12px">
     ${esc(summary)}
    </div>
   </details>


   <div class="meta">
    盤口來源：${esc(o.source)}（時間未驗證）<br>
    勝率為未校準的研究模型試算，
    不是市場報價或已驗證的準確率。
   </div>

   <button class="fav" data-fav="${esc(g.id)}">
    ${fav.includes(g.id)?"★ 已收藏":"☆ 收藏"}
   </button>
  </div>
 </article>`;
}

function render(){
 const titles={
  home:"NBA 賽事分析",
  scores:"NBA 比分",
  schedule:"NBA 賽程",
  favs:"我的收藏",
  mine:"我的設定"
 };

 $("title").textContent=titles[page];
 $("dateLabel").textContent=selected()+" · 台灣日期";

 $("settings").classList.toggle("hidden",page!=="mine");
 $("cards").classList.toggle("hidden",page==="mine");
 $("search").classList.toggle("hidden",page==="mine");

 document.querySelectorAll("nav button").forEach(b=>
  b.classList.toggle(
   "active",b.dataset.page===page
  )
 );

 const q=$("search").value.toLowerCase().trim();

 const list=games.filter(g=>{
  const c=g.competitions?.[0]?.competitors||[];
  const match=c.some(x=>
   (teamName(x)+" "+(x.team?.abbreviation||""))
   .toLowerCase().includes(q)
  );

  return match&&
   (page!=="favs"||fav.includes(g.id))&&
   (page!=="scores"||
    g.status?.type?.state!=="pre");
 });

 $("count").textContent=
  page==="mine"?"設定":list.length+" 場";

 $("cards").innerHTML=page==="mine"?"":(
  list.map(gameCard).join("")||
  '<div class="empty">沒有符合條件的比賽</div>'
 );
}

async function load(){
 const token=++request;
 const date=selected();

 const previous=new Date(
  new Date(date+"T00:00:00Z").getTime()-86400000
 ).toISOString().slice(0,10);

 const season=seasonYear(date);
 $("status").textContent="正在更新真實 NBA 資料…";

 const jobs=await Promise.allSettled([
  getJSON(SCORE+previous.replace(/-/g,"")),
  getJSON(SCORE+date.replace(/-/g,"")),
  getJSON(TABLE+(season-1)),
  getJSON(TABLE+season)
 ]);

 if(token!==request)return;

 const matchMap=new Map();
 let validScore=0;

 for(const job of jobs.slice(0,2)){
  if(job.status!=="fulfilled")continue;
  validScore++;

  for(const g of job.value.events||[]){
   if(g.id&&g.date&&
    dateTW(new Date(g.date))===date){
    matchMap.set(g.id,g);
   }
  }
 }

 if(validScore===0){
  $("status").textContent=
   "資料讀取失敗，請按重新整理。";
  return;
 }

 games=[...matchMap.values()].sort(
  (x,y)=>new Date(x.date)-new Date(y.date)
 );

 prevData=jobs[2].status==="fulfilled"?
  parseTable(jobs[2].value):new Map();

 nowData=jobs[3].status==="fulfilled"?
  parseTable(jobs[3].value):new Map();

 lastUpdated=new Date();

 $("status").textContent=
  "更新："+timeTW(lastUpdated)+
  " · ESPN｜上季 "+prevData.size+
  " 隊／本季 "+nowData.size+" 隊";

 render();
}

$("prev").onclick=()=>{offset--;load()};
$("today").onclick=()=>{offset=0;load()};
$("next").onclick=()=>{offset++;load()};
$("refresh").onclick=load;
$("search").oninput=render;

document.querySelectorAll("nav button").forEach(b=>{
 b.onclick=()=>{
  page=b.dataset.page;
  render();
  window.scrollTo(0,0);
 };
});

$("cards").onclick=e=>{
 const b=e.target.closest("[data-fav]");
 if(!b)return;
 const id=b.dataset.fav;

 fav=fav.includes(id)?
  fav.filter(x=>x!==id):[...fav,id];

 try{
  localStorage.setItem(
   "sportsai_fav_v1",JSON.stringify(fav)
  );
 }catch(e){}

 render();
};

$("clear").onclick=()=>{
 if(confirm("清空所有收藏？")){
  fav=[];
  localStorage.removeItem("sportsai_fav_v1");
  render();
 }
};

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden)load();
});

load();

setInterval(()=>{
 if(!document.hidden)load();
},300000);
</script>

<script>
<script>
/* Sports AI v1.4 - Data Model Update */
(function(){

function numberStat(stats,names){
 const item=(stats||[]).find(x=>{
  const a=String(x.name||"")
   .toLowerCase().replace(/[^a-z0-9]/g,"");
  const b=String(x.abbreviation||"")
   .toLowerCase().replace(/[^a-z0-9]/g,"");
  return names.includes(a)||names.includes(b);
 });

 if(!item)return null;

 const n=Number(item.value??item.displayValue);
 return Number.isFinite(n)?n:null;
}

function recentRecord(stats){
 const item=(stats||[]).find(x=>{
  const text=(
   String(x.name||"")+" "+
   String(x.abbreviation||"")
  ).toLowerCase().replace(/[^a-z0-9]/g,"");

  return text.includes("lasttengames")||
   text==="l10"||
   text.includes("lastten");
 });

 if(!item)return null;

 const value=String(item.displayValue||"");
 const match=value.match(/(\d+)\s*-\s*(\d+)/);

 if(!match)return null;

 const w=Number(match[1]);
 const l=Number(match[2]);
 const n=w+l;

 if(n<5||n>10)return null;
 return {w,l,n,p:w/n};
}

// 使用明確的場均得失分或總得失分。
// 不把未知單位的 differential 當作總分差。
parseTable=function(data){
 const output=new Map();

 function walk(node){
  if(!node||typeof node!=="object")return;

(function(){

function numberStat(stats,names){

  const a=String(x.name||"")
   .toLowerCase().replace(/[^a-z0-9]/g,"");
  const b=String(x.abbreviation||"")
   .toLowerCase().replace(/[^a-z0-9]/g,"");
  return names.includes(a)||names.includes(b);
 });

 if(!item)return null;

 const n=Number(item.value??item.displayValue);
 return Number.isFinite(n)?n:null;
}

function recentRecord(stats){

  const text=(
   String(x.name||"")+" "+
   String(x.abbreviation||"")
  ).toLowerCase().replace(/[^a-z0-9]/g,"");

<script>
/* Sports AI v1.5 - NBA Injury Information */
(function(){

const INJURY_API =
 "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries";

let injuriesByTeam = new Map();
let injuryMessage = "正在確認傷兵資訊";
let injuryChecked = "";
let injuryRequest = 0;

function injuryText(v){
 return esc(String(v??""));
}

function injuryStatus(status){
 const s=String(status||"").toLowerCase();

 if(s==="out")return "缺陣";
 if(s==="questionable")return "出賽存疑";
 if(s==="doubtful")return "極可能缺陣";
 if(s==="probable")return "預計可出賽";
 if(s==="day-to-day")return "每日觀察";
 if(s==="active")return "可出賽";

 return status||"狀態未確認";
}

function parseInjuries(data){
 const result=new Map();

 if(!Array.isArray(data?.injuries)){
  throw Error("傷兵資料格式不符");
 }

 for(const group of data.injuries){
  const teamId=String(group.team?.id||"");
  if(!teamId)continue;

  const items=[];

  for(const item of group.injuries||[]){
   const athlete=item.athlete||{};

   const player=String(
    athlete.displayName||
    athlete.fullName||""
   ).trim();

   const rawStatus=
    typeof item.status==="object"?
    (item.status?.name||item.status?.type||""):
    (item.status||"");

   if(!player)continue;

   items.push({
    player,
    status:injuryStatus(rawStatus),
    type:item.type?.description||
         item.type?.name||""
   });
  }

  result.set(teamId,items);
 }

 return result;
}

function injuryList(team){
 const id=String(team.team?.id||"");

 if(injuryMessage!=="已取得 ESPN 傷兵資料"){
  return "<p>"+injuryText(injuryMessage)+"</p>";
 }

 if(!injuriesByTeam.has(id)){
  return "<p>這支球隊的傷兵資料尚未確認</p>";
 }

 const list=injuriesByTeam.get(id);

 if(!list.length){
  return "<p>來源目前沒有列出傷兵，" +
   "不代表全隊都能出賽。</p>";
 }

 return list.slice(0,12).map(p=>
  "<div style='margin:6px 0'>" +
  "• "+injuryText(p.player)+
  "｜"+injuryText(p.status)+
  (p.type?"（"+injuryText(p.type)+"）":"")+
  "</div>"
 ).join("");
}

const originalGameCard=gameCard;

gameCard=function(g){
 let html=originalGameCard(g);

 const competitors=
  g.competitions?.[0]?.competitors||[];

 const away=competitors.find(
  x=>x.homeAway==="away"
 );

 const home=competitors.find(
  x=>x.homeAway==="home"
 );

 if(!away||!home)return html;

 const extra=`
  <div style="
   border-top:1px solid #40516a;
   margin-top:12px;padding-top:12px;
   font-size:12px;line-height:1.8
  ">
   <b>🏥 傷兵資訊</b>

   <div style="margin-top:8px">
    <strong>${injuryText(teamName(away))}</strong>
    ${injuryList(away)}
   </div>

   <div style="margin-top:8px">
    <strong>${injuryText(teamName(home))}</strong>
    ${injuryList(home)}
   </div>

   <div style="color:#aab8cd;margin-top:9px">
    資料來源：ESPN<br>
    檢查時間：${injuryText(injuryChecked||"尚未取得")}<br>
    資料不等於 NBA 官方當場最終出賽名單。
   </div>

   <a
    href="https://official.nba.com/nba-injury-report-2026-27-season/"
    target="_blank"
    rel="noopener noreferrer"
    style="color:#ff7893"
   >查看 NBA 官方傷兵報告</a>
  </div>
 `;

 // 傷兵資料放在可展開的 AI 分析裡
 return html.replace(
  "</details>",
  extra+"</details>"
 );
};

async function updateInjuries(){
 const token=++injuryRequest;

 injuryMessage="正在確認傷兵資訊";

 try{
  const response=await fetch(INJURY_API,{
   cache:"no-store"
  });

  if(!response.ok){
   throw Error("HTTP "+response.status);
  }

  const data=await response.json();
  const parsed=parseInjuries(data);

  if(token!==injuryRequest)return;

  injuriesByTeam=parsed;
  injuryMessage="已取得 ESPN 傷兵資料";

 }catch(error){
  if(token!==injuryRequest)return;

  injuriesByTeam=new Map();
  injuryMessage="ESPN 傷兵資料暫時無法確認";
 }

 injuryChecked=new Intl.DateTimeFormat(
  "zh-TW",{
   timeZone:"Asia/Taipei",
   month:"2-digit",day:"2-digit",
   hour:"2-digit",minute:"2-digit",
   hour12:false
  }
 ).format(new Date());

 render();
}

// 開啟頁面時讀取
updateInjuries();

// 按更新按鈕時也重新讀取
$("refresh").addEventListener(
 "click",updateInjuries
);

// App 開啟期間每五分鐘更新
setInterval(()=>{
 if(!document.hidden)updateInjuries();
},300000);

document.addEventListener(
 "visibilitychange",()=>{
  if(!document.hidden)updateInjuries();
 }
);

})();
</script>
 

<script>
/* Sports AI v1.5.1 Injury Diagnostic */
(function(){
 const URL=
 "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries";

 let report="正在測試 ESPN 傷兵資料…";

 function show(){
  document.querySelectorAll(
   "details.analysis"
  ).forEach(box=>{
   let el=box.querySelector(".injury-debug");

   if(!el){
    el=document.createElement("div");
    el.className="injury-debug";
    el.style.cssText=
     "margin-top:12px;padding:10px;"+
     "border:1px solid #52627b;"+
     "border-radius:9px;font-size:12px;"+
     "line-height:1.8;color:#cad6e7";
    box.appendChild(el);
   }

   el.textContent="🔎 傷兵診斷："+report;
  });
 }

 const oldRender=render;

 render=function(){
  oldRender();
  show();
 };

 async function check(){
  report="正在連線…";
  show();

  try{
   const r=await fetch(URL,{
    cache:"no-store"
   });

   if(!r.ok){
    report="API 回應錯誤：HTTP "+r.status;
    show();
    return;
   }

   const data=await r.json();

   const groups=Array.isArray(data.injuries)?
    data.injuries:null;

   if(!groups){
    report="資料格式不同；頂層欄位："+ 
     Object.keys(data).slice(0,8).join(", ");
   }else{
    const ids=groups.map(x=>
     String(x.team?.id||"未知")
    );

    const count=groups.reduce(
     (n,x)=>n+(x.injuries?.length||0),0
    );

    report=
     "讀取成功；球隊組數："+groups.length+
     "；球員筆數："+count+
     "；來源球隊 ID："+ids.slice(0,30).join(",");
   }

  }catch(e){
   report="連線或解析失敗："+e.message;
  }

  show();
 }

 $("refresh").addEventListener("click",check);
 check();
})();
</script>
