

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a101e">
<title>Sports AI v1.0</title>
<style>
:root{
 --bg:#0a101e;
 --card:#111c30;
 --soft:#202d43;
 --red:#fb3659;
 --muted:#aab8cd;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:#f5f7fd;
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
}
header{
 background:linear-gradient(135deg,#202940,#0b1120);
 padding:24px 18px;
}
.brand{font-size:28px;font-weight:850}
.brand b{color:var(--red)}
small,.muted{color:var(--muted);font-size:12px;line-height:1.6}
.headrow,.row{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;
}
.chip{
 color:#ffd9df;background:#5b2339;
 border-radius:20px;padding:7px 11px;font-size:12px;
}
main{max-width:680px;margin:auto;padding:18px 13px 115px}
h1{font-size:22px;margin:2px 0 7px}
button,input{font:inherit}
button{
 background:#212d42;border:0;border-radius:11px;
 padding:12px 9px;color:#f1f4fb;cursor:pointer;
}
.active,.primary{
 background:linear-gradient(100deg,#fc3b60,#b61e3e)!important;
 color:white;
}
.controls{display:flex;gap:7px;margin:13px 0}
.controls button{flex:1;font-size:13px;min-width:0}
.search{
 width:100%;background:#202c40;
 border:1px solid #42516a;border-radius:11px;
 padding:13px;color:white;font-size:16px;
}
.status{
 border:1px solid #394b65;background:#141e30;
 border-radius:11px;margin:13px 0;padding:12px;
 color:#c3ccda;font-size:12px;line-height:1.7;
}
.card{
 border:1px solid #694052;background:#111a2c;
 border-radius:19px;overflow:hidden;margin:14px 0;
}
.cardhead{
 background:linear-gradient(95deg,#fb3b60,#b91d42);
 padding:13px 15px;font-weight:800;
}
.content{padding:15px}
.teams{
 display:grid;grid-template-columns:1fr 34px 1fr;
 align-items:center;text-align:center;gap:8px;margin:13px 0;
}
.team{min-width:0;font-weight:750}
.team img{
 width:56px;height:56px;object-fit:contain;
 display:block;margin:0 auto 7px;
}
.vs{color:#93a5bd;font-size:12px}
.score{font-size:23px;color:#ff647b;font-weight:800}
.market{
 display:grid;grid-template-columns:1.15fr 1fr 1fr;
 gap:7px;margin:13px 0;
}
.market div{
 background:#202d43;border-radius:9px;
 padding:11px 5px;text-align:center;
 min-width:0;font-size:13px;
}
.market .lab{
 color:#aab8cc;background:transparent;
 font-size:11px;padding:6px 1px;
}
.note{
 padding:12px;border:1px solid #553748;
 background:#1a2539;border-radius:12px;
 font-size:13px;line-height:1.75;
}
.note strong{
 display:block;color:#ff8197;margin-bottom:5px;
}
.foot{
 color:#a9b7ca;font-size:11px;
 margin-top:10px;line-height:1.7;
}
.actionrow{
 display:flex;justify-content:flex-end;margin-top:12px;
}
.actionrow button{font-size:13px}
.empty{
 padding:30px;text-align:center;color:var(--muted);
}
nav{
 position:fixed;bottom:0;left:0;width:100%;
 display:grid;grid-template-columns:repeat(5,1fr);
 background:#101a2b;border-top:1px solid #2f3c50;
 padding:8px 3px max(13px,env(safe-area-inset-bottom));
 z-index:5;
}
nav button{
 background:none;font-size:11px;
 color:#abb8c9;padding:4px 0;
}
nav button.active{
 background:none!important;color:#ff6e87;
}
nav span{display:block;font-size:22px;margin-bottom:3px}
.hidden{display:none!important}
</style>
</head>

<body>
<header>
<div class="headrow">
 <div>
  <div class="brand">賽事 <b>AI</b></div>
  <small>SPORTS INTELLIGENCE · NBA</small>
 </div>
 <span class="chip">🇹🇼 台灣時間</span>
</div>
</header>

<main>
<div class="row">
 <div>
  <h1 id="title">NBA 賽事分析</h1>
  <small id="dateLabel"></small>
 </div>
 <span class="chip" id="count">— 場</span>
</div>

<div class="controls">
 <button id="prev">◀ 前一天</button>
 <button id="today" class="active">今天</button>
 <button id="next">後一天 ▶</button>
 <button id="refresh">⟳</button>
</div>

<input id="search" class="search"
 placeholder="搜尋球隊（中文／英文縮寫）">

<div class="status" id="status">
準備讀取 NBA 資料…
</div>

<div id="cards"></div>

<div class="status hidden" id="settings">
 <b>Sports AI v1.0</b>
 <p>
 本版讀取 ESPN NBA 賽程、比分與可取得的盤口。
 沒有雙方真實獨贏報價時，不顯示市場機率。
 傷兵與先發未核實前，暫不提供 AI 推薦。
 </p>
 <button id="clear">清空收藏</button>
</div>

<small>
資料來源：ESPN 非官方公開介面。
資料可能延遲、中斷或缺漏。
本工具不會自動下注。
</small>
</main>

<nav id="nav">
 <button class="active" data-page="home"><span>⌂</span>首頁</button>
 <button data-page="scores"><span>▥</span>比分</button>
 <button data-page="schedule"><span>▦</span>賽事</button>
 <button data-page="favs"><span>☆</span>收藏</button>
 <button data-page="mine"><span>♙</span>我的</button>
</nav>

<script>
"use strict";

const API=
"https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=";

const ZH={
ATL:"老鷹",BOS:"塞爾提克",BKN:"籃網",
BRK:"籃網",CHA:"黃蜂",CHI:"公牛",
CLE:"騎士",DAL:"獨行俠",DEN:"金塊",
DET:"活塞",GS:"勇士",GSW:"勇士",
HOU:"火箭",IND:"溜馬",LAC:"快艇",
LAL:"湖人",MEM:"灰熊",MIA:"熱火",
MIL:"公鹿",MIN:"灰狼",NO:"鵜鶘",
NOP:"鵜鶘",NY:"尼克",NYK:"尼克",
OKC:"雷霆",ORL:"魔術",PHI:"76人",
PHX:"太陽",POR:"拓荒者",SA:"馬刺",
SAS:"馬刺",SAC:"國王",TOR:"暴龍",
UTA:"爵士",UTAH:"爵士",WAS:"巫師",
WSH:"巫師"
};

const $=id=>document.getElementById(id);

let offset=0;
let page="home";
let games=[];
let request=0;
let partial=false;
let fav=[];

try{
 const f=JSON.parse(
  localStorage.getItem("sportsai_fav_v1")||"[]"
 );
 if(Array.isArray(f))fav=f;
}catch(e){}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",
  ">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function taiwanDate(date){
 const p=new Intl.DateTimeFormat("en-US",{
  timeZone:"Asia/Taipei",
  year:"numeric",month:"2-digit",day:"2-digit"
 }).formatToParts(date);

 const a={};
 for(const x of p)a[x.type]=x.value;

 return a.year+"-"+a.month+"-"+a.day;
}

function chosen(){
 const [y,m,d]=taiwanDate(new Date())
  .split("-").map(Number);

 return new Date(
  Date.UTC(y,m-1,d+offset)
 ).toISOString().slice(0,10);
}

function twTime(d){
 return new Intl.DateTimeFormat("zh-TW",{
  timeZone:"Asia/Taipei",
  month:"2-digit",day:"2-digit",
  hour:"2-digit",minute:"2-digit",
  hour12:false
 }).format(new Date(d));
}

function name(c){
 const t=c?.team||{};
 return ZH[t.abbreviation]||
  t.displayName||"未知隊伍";
}

function logo(c){
 const t=c?.team||{};
 return t.logo||t.logos?.[0]?.href||"";
}

function state(g){
 const s=g.status?.type?.state;
 return s==="post"?"已完賽":
  s==="in"?"進行中":"尚未開賽";
}

function pctAmerican(v){
 if(v===null||v===undefined||v==="")return null;

 const n=Number(v);
 if(!Number.isFinite(n)||!n)return null;

 return n>0?100/(n+100):-n/(-n+100);
}

function oddsInfo(g,a,h){
 const o=g.competitions?.[0]?.odds?.[0];

 if(!o)return {
  spread:"待取得",
  sa:"待取得",sh:"待取得",
  away:"—",home:"—",
  source:"無盤口資料",
  hasML:false
 };

 const ap=pctAmerican(
  o.awayTeamOdds?.moneyLine
 );
 const hp=pctAmerican(
  o.homeTeamOdds?.moneyLine
 );

 const total=ap!==null&&hp!==null
  ?ap+hp:null;

 let sa="待取得";
 let sh="待取得";

 const detail=String(o.details||"").trim();

 const m=detail.match(
  /^([A-Z]{2,5})\s*([+-]\d+(?:\.\d+)?)$/i
 );

 if(m){
  const ab=m[1].toUpperCase();
  const pts=Number(m[2]);

  const ac=String(
   a.team?.abbreviation||""
  ).toUpperCase();

  const hc=String(
   h.team?.abbreviation||""
  ).toUpperCase();

  const fmt=n=>n>0?"+"+n:String(n);

  if(ab===ac){
   sa=fmt(pts);
   sh=fmt(-pts);
  }else if(ab===hc){
   sa=fmt(-pts);
   sh=fmt(pts);
  }
 }

 return {
  spread:detail||"待取得",
  sa,sh,
  away:total?
   (ap/total*100).toFixed(1)+"%":"—",
  home:total?
   (hp/total*100).toFixed(1)+"%":"—",
  source:o.provider?.name||"ESPN",
  hasML:!!total
 };
}

function teamBlock(c,played){
 const image=logo(c);

 return `
 <div class="team">
 ${image?
  `<img src="${esc(image)}"
  alt="${esc(name(c))}隊徽" loading="lazy">`:""}
 <div>${esc(name(c))}</div>
 <small>
 ${esc(c.team?.abbreviation||"")}
 · ${c.homeAway==="home"?"主":"客"}
 </small>
 ${played?
  `<div class="score">${esc(c.score??"—")}</div>`:""}
 </div>`;
}

function card(g){
 const c=g.competitions?.[0]?.competitors||[];

 const a=c.find(x=>x.homeAway==="away");
 const h=c.find(x=>x.homeAway==="home");

 if(!a||!h)return "";

 const o=oddsInfo(g,a,h);
 const played=state(g)!=="尚未開賽";

 let summary="已取得賽程資料。";

 if(played){
  summary="本場已開始或完賽，僅顯示賽事與市場資料，不倒推賽前預測。";
 }else if(o.hasML){
  summary="已取得獨贏市場報價，百分比是去水位後的市場隱含機率，不是 AI 預測。";
 }else{
  summary="目前尚缺可驗證的雙方獨贏報價，暫不提供勝率。";
 }

 summary+=" 關鍵傷兵與先發未完成查核，暫不推薦投注方向。";

 return `
 <article class="card">
  <div class="cardhead">
   NBA｜${esc(state(g))} · ${esc(twTime(g.date))}
  </div>
  <div class="content">
   <div class="teams">
    ${teamBlock(a,played)}
    <span class="vs">VS</span>
    ${teamBlock(h,played)}
   </div>

   <div class="market">
    <div class="lab">隊伍</div>
    <div class="lab">獨贏市場機率</div>
    <div class="lab">讓分</div>

    <div>${esc(name(a))}</div>
    <div>${esc(o.away)}</div>
    <div>${esc(o.sa)}</div>

    <div>${esc(name(h))}</div>
    <div>${esc(o.home)}</div>
    <div>${esc(o.sh)}</div>
   </div>

   <div class="note">
    <strong>賽前分析摘要</strong>
    ${esc(summary)}
   </div>

   <div class="foot">
    盤口來源：${esc(o.source)}<br>
    盤口更新時間未驗證。<br>
    讓分過盤勝率：待可靠模型。<br>
    ${o.spread!=="待取得"?
     "盤口原文："+esc(o.spread):""}
   </div>

   <div class="actionrow">
    <button data-fav="${esc(g.id)}">
    ${fav.includes(g.id)?"★ 已收藏":"☆ 收藏"}
    </button>
   </div>
  </div>
 </article>`;
}

function render(){
 const labels={
  home:"NBA 賽事分析",
  scores:"NBA 比分",
  schedule:"NBA 賽程",
  favs:"我的收藏",
  mine:"我的設定"
 };

 $("title").textContent=labels[page];
 $("dateLabel").textContent=chosen()+" · 台灣日期";

 $("settings").classList.toggle(
  "hidden",page!=="mine"
 );
 $("cards").classList.toggle(
  "hidden",page==="mine"
 );
 $("search").classList.toggle(
  "hidden",page==="mine"
 );

 document.querySelectorAll("nav button").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===page);
 });

 const q=$("search").value.toLowerCase().trim();

 const list=games.filter(g=>{
  const c=g.competitions?.[0]?.competitors||[];

  const match=c.some(x=>
   (name(x)+" "+(x.team?.abbreviation||""))
    .toLowerCase().includes(q)
  );

  return match &&
   (page!=="favs"||fav.includes(g.id)) &&
   (page!=="scores"||
    g.status?.type?.state!=="pre");
 });

 $("count").textContent=page==="mine"?
  "設定":list.length+" 場";

 $("cards").innerHTML=page==="mine"?"":(
  list.map(card).join("")||
  '<div class="empty">沒有符合條件的賽事</div>'
 );
}

async function fetchDay(day){
 const ctl=new AbortController();
 const timer=setTimeout(()=>ctl.abort(),15000);

 try{
  const r=await fetch(
   API+day.replace(/-/g,""),
   {signal:ctl.signal}
  );

  if(!r.ok)throw Error("HTTP "+r.status);

  return (await r.json()).events||[];
 }finally{
  clearTimeout(timer);
 }
}

async function load(){
 const id=++request;
 const date=chosen();

 const prior=new Date(
  new Date(date+"T00:00:00Z").getTime()-86400000
 ).toISOString().slice(0,10);

 $("status").textContent="正在更新 ESPN NBA 資料…";

 const results=await Promise.allSettled([
  fetchDay(prior),fetchDay(date)
 ]);

 if(id!==request)return;

 partial=results.some(
  r=>r.status==="rejected"
 );

 if(results.every(r=>r.status==="rejected")){
  $("status").textContent=
   "資料連線失敗，請重新整理。";
  render();
  return;
 }

 const map=new Map();

 for(const r of results){
  if(r.status!=="fulfilled")continue;

  for(const g of r.value){
   if(
    g.id&&g.date&&
    taiwanDate(new Date(g.date))===date
   ){
    map.set(g.id,g);
   }
  }
 }

 games=[...map.values()].sort(
  (x,y)=>new Date(x.date)-new Date(y.date)
 );

 $("status").textContent=
  "已更新："+twTime(new Date())+" · ESPN"+
  (partial?"（部分資料來源失敗）":"");

 render();
}

$("prev").onclick=()=>{
 offset--;
 load();
};

$("next").onclick=()=>{
 offset++;
 load();
};

$("today").onclick=()=>{
 offset=0;
 load();
};

$("refresh").onclick=load;
$("search").oninput=render;

document.querySelectorAll("nav button").forEach(b=>{
 b.onclick=()=>{
  page=b.dataset.page;
  render();
  window.scrollTo(0,0);
 };
});

$("cards").onclick=e=>{
 const b=e.target.closest("[data-fav]");
 if(!b)return;

 const id=b.dataset.fav;

 fav=fav.includes(id)?
  fav.filter(x=>x!==id):[...fav,id];

 try{
  localStorage.setItem(
   "sportsai_fav_v1",JSON.stringify(fav)
  );
 }catch(e){}

 render();
};

$("clear").onclick=()=>{
 if(confirm("確定清空收藏？")){
  fav=[];
  try{
   localStorage.removeItem("sportsai_fav_v1");
  }catch(e){}
  render();
 }
};

load();

setInterval(()=>{
 if(!document.hidden)load();
},300000);
</script>
</body>
</html>
