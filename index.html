<body>
<header>
 <div class="row">
  <div>

<main>
 <div class="row">

   <h2 id="title">NBA 賽事分析</h2>

  </div>
  <span class="chip" id="count">— 場</span>

 <div class="controls">
  <button id="prev">◀ 前一天</button>

 </div>

 <input id="search" class="search"
 placeholder="搜尋球隊">

 <div id="status" class="status">
 正在讀取 NBA 資料…
 </div>

 <div id="cards"></div>

 <div id="settings" class="hidden">
  <div class="analysis">
   <b>Sports AI v1.6</b>
   <p>開啟網站時更新，開啟期間每五分鐘更新。</p>
   <p>
    獨贏與讓分採用不同模型。
    所有模型機率仍未經完整歷史校準。
   </p>
   <p>
    傷兵資訊在背景嘗試核對。

   </p>
   <button id="clear">清空收藏</button>
  </div>
 </div>

 <small>
 ESPN 公開資料。模型僅供研究，

<nav>

  <span>⌂</span>首頁

 </button>
 <button data-page="schedule">
  <span>▦</span>賽事
 </button>

  <span>☆</span>收藏
 </button>

  <span>♙</span>我的

<script>
"use strict";

const $=id=>document.getElementById(id);

const API="https://site.api.espn.com/apis/site/v2/sports/basketball/nba/";
const STANDINGS=
 "https://site.api.espn.com/apis/v2/sports/basketball/nba/standings?season=";

const ZH={
 ATL:"老鷹",BOS:"塞爾提克",BKN:"籃網",
 BRK:"籃網",CHA:"黃蜂",CHI:"公牛",
 CLE:"騎士",DAL:"獨行俠",DEN:"金塊",
 DET:"活塞",GS:"勇士",GSW:"勇士",
 HOU:"火箭",IND:"溜馬",LAC:"快艇",
 LAL:"湖人",MEM:"灰熊",MIA:"熱火",
 MIL:"公鹿",MIN:"灰狼",NO:"鵜鶘",
 NOP:"鵜鶘",NY:"尼克",NYK:"尼克",
 OKC:"雷霆",ORL:"魔術",PHI:"76人",
 PHX:"太陽",POR:"拓荒者",SA:"馬刺",
 SAS:"馬刺",SAC:"國王",TOR:"暴龍",
 UTA:"爵士",UTAH:"爵士",WAS:"巫師",
 WSH:"巫師"
};

let offset=0,page="home",games=[];
let lastUpdated=null,request=0;
let previousStats=new Map();
let currentStats=new Map();
let injuryData=new Map();
let injuryState="尚未核實";
let fav=[];

try{
 const f=JSON.parse(
  localStorage.getItem("sportsai_fav_v1")||"[]"
 );
 if(Array.isArray(f))fav=f;
}catch(e){}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function localDate(d){
 const parts=new Intl.DateTimeFormat("en-US",{
  timeZone:"Asia/Taipei",year:"numeric",
  month:"2-digit",day:"2-digit"
 }).formatToParts(d);
 const o={};
 for(const p of parts)o[p.type]=p.value;
 return `${o.year}-${o.month}-${o.day}`;
}

function selected(){
 const [y,m,d]=localDate(new Date())
  .split("-").map(Number);
 return new Date(Date.UTC(y,m-1,d+offset))
  .toISOString().slice(0,10);
}

function twTime(date){
 return new Intl.DateTimeFormat("zh-TW",{
  timeZone:"Asia/Taipei",
  month:"2-digit",day:"2-digit",
  hour:"2-digit",minute:"2-digit",
  hour12:false
 }).format(new Date(date));
}

function teamName(c){
 const t=c?.team||{};
 return ZH[t.abbreviation]||t.displayName||"未知球隊";
}

function state(g){
 const t=g.status?.type?.state;
 return t==="post"?"已完賽":
  t==="in"?"進行中":"尚未開賽";
}

async function getJSON(url){
 const ctl=new AbortController();
 const timer=setTimeout(()=>ctl.abort(),16000);
 try{
  const r=await fetch(url,{
   cache:"no-store",signal:ctl.signal
  });
  if(!r.ok)throw Error("HTTP "+r.status);
  return await r.json();
 }finally{
  clearTimeout(timer);
 }
}

function stat(stats,names){
 const normalize=x=>String(x||"")
  .toLowerCase().replace(/[^a-z0-9]/g,"");

 const s=(stats||[]).find(x=>
  names.includes(normalize(x.name))||
  names.includes(normalize(x.abbreviation))
 );

 if(!s)return null;
 const v=Number(s.value??s.displayValue);
 return Number.isFinite(v)?v:null;
}

function parseRecent(stats){
 const x=(stats||[]).find(s=>{
  const n=String(s.name||"").toLowerCase()
   .replace(/[^a-z0-9]/g,"");
  return n==="lasttengames"||n==="lastten";
 });

 const m=String(x?.displayValue||"")
  .match(/(\d+)\s*-\s*(\d+)/);

 if(!m)return null;
 const w=+m[1],l=+m[2];
 const n=w+l;
 return n>=5&&n<=10?w/n:null;
}

function parseStandings(data){
 const map=new Map();

 function walk(node){
  if(!node||typeof node!=="object")return;
  if(Array.isArray(node)){
   node.forEach(walk);return;
  }

  for(const e of node.entries||[]){
   const t=e.team||{};
   const s=e.stats||[];
   const w=stat(s,["wins","w"]);
   const l=stat(s,["losses","l"]);

   if(!t.id||w===null||l===null)continue;
   const n=w+l;

   const pf=stat(s,["avgpointsfor"]);
   const pa=stat(s,["avgpointsagainst"]);
   const totalF=stat(s,["pointsfor"]);
   const totalA=stat(s,["pointsagainst"]);

   let margin=null;
   if(pf!==null&&pa!==null){
    margin=pf-pa;
   }else if(
    n>0&&totalF!==null&&totalA!==null
   ){
    margin=(totalF-totalA)/n;
   }

   map.set(String(t.id),{
    w,l,n,p:n?w/n:0.5,
    margin,recent:parseRecent(s)
   });
  }

  if(node.children)walk(node.children);
  if(node.standings)walk(node.standings);
 }

 walk(data);
 return map;
}

function seasonYear(date){
 const [y,m]=date.split("-").map(Number);
 return m>=10?y+1:y;
}

function teamRecord(c,map){
 return map.get(String(c.team?.id||""))||null;
}

function blend(prior,current,key){
 if(!Number.isFinite(prior?.[key]))return null;

 const weight=12;
 const n=current?.n||0;

 if(!n||!Number.isFinite(current?.[key])){
  return prior[key];
 }

 return (
  prior[key]*weight+
  current[key]*n
 )/(weight+n);
}

// 獨贏機率：戰績與近期表現研究模型。
// 參數未經完整歷史校準。
function winModel(a,h){
 const ap=teamRecord(a,previousStats);
 const hp=teamRecord(h,previousStats);

 if(!ap||!hp||ap.n<20||hp.n<20)return null;

 const ac=teamRecord(a,currentStats);
 const hc=teamRecord(h,currentStats);

 const away=blend(ap,ac,"p");
 const home=blend(hp,hc,"p");

 let logit=2.4*(home-away)+0.12;

 if(
  Number.isFinite(ac?.recent)&&
  Number.isFinite(hc?.recent)
 ){
  logit+=0.5*(hc.recent-ac.recent);
 }

 const p=1/(1+Math.exp(-logit));
 return {home:p,away:1-p};
}

function normalCDF(z){
 const x=Math.abs(z);
 const t=1/(1+0.2316419*x);
 const d=0.3989422804*Math.exp(-x*x/2);

 const tail=d*t*(
  0.319381530+t*(-0.356563782+
  t*(1.781477937+t*(-1.821255978+
  t*1.330274429)))
 );

 return z>=0?1-tail:tail;
}

// 讓分機率：歷史平均分差加主場假設。
// 標準差12分是尚未校準的研究參數。
function coverModel(a,h,homeLine){
 const ap=teamRecord(a,previousStats);
 const hp=teamRecord(h,previousStats);

 if(
  !Number.isFinite(ap?.margin)||
  !Number.isFinite(hp?.margin)
 )return null;

 const ac=teamRecord(a,currentStats);
 const hc=teamRecord(h,currentStats);

 const am=blend(ap,ac,"margin");
 const hm=blend(hp,hc,"margin");

 const expected=(hm-am)/2+2.5;
 const p=normalCDF((expected+homeLine)/12);

 return {home:p,away:1-p,expected};
}

function market(g,a,h){
 const o=g.competitions?.[0]?.odds?.[0];
 const detail=String(o?.details||"").trim();

 const m=detail.match(
  /^([A-Z]{2,5})\s*([+-]\d+(?:\.\d+)?)$/i
 );

 let away=null,home=null;

 if(m){
  const ab=m[1].toUpperCase();
  const val=Number(m[2]);
  const aa=String(a.team?.abbreviation||"")
   .toUpperCase();
  const ha=String(h.team?.abbreviation||"")
   .toUpperCase();

  if(ab===aa){
   away=val;home=-val;
  }else if(ab===ha){
   home=val;away=-val;
  }
 }

 return {
  away,home,
  source:o?.provider?.name||"未提供"
 };
}

// 傷兵資料：只接受有可靠球隊識別的紀錄。
// 不把無法匹配球隊的資料強行分配。
function parseInjuries(data){
 const map=new Map();
 const groups=Array.isArray(data?.injuries)?
  data.injuries:[];

 for(const group of groups){
  const rawTeam=group.team||{};
  const teamId=String(
   rawTeam.id||group.teamId||""
  );

  const rows=group.injuries||[];

  for(const entry of rows){
   const player=entry.athlete||{};
   const entryTeam=entry.team||player.team||{};

   const id=String(
    entryTeam.id||teamId||""
   );

   const name=String(
    player.displayName||
    player.fullName||
    entry.displayName||""
   ).trim();

   const raw=entry.status;
   const status=typeof raw==="string"?
    raw:String(raw?.name||raw?.type||"");

   if(!id||!name||!status)continue;

   if(!map.has(id))map.set(id,[]);
   map.get(id).push({name,status});
  }
 }

 return map;
}

function injurySummary(a,h){
 if(injuryState!=="已核對來源"){
  return "傷兵來源尚未完成核對，未納入模型。";
 }

 const ai=injuryData.get(String(a.team?.id||""));
 const hi=injuryData.get(String(h.team?.id||""));

 if(!ai||!hi){
  return "雙方傷兵資料未完整對應，未納入模型。";
 }

 return "已讀取雙方可對應的傷兵紀錄，"+
  "但尚未驗證球員影響權重，勝率未作傷兵調整。";
}

function fmtP(n){
 return Number.isFinite(n)?
  (n*100).toFixed(1)+"%":"待計算";
}

function fmtLine(n){
 return Number.isFinite(n)?
  (n>0?"+":"")+n:"—";
}

function teamBox(c,played){
 const t=c.team||{};
 const logo=t.logo||t.logos?.[0]?.href;

 return `
 <div class="team">
  ${logo?`
   <img src="${esc(logo)}"
    alt="${esc(teamName(c))}隊徽">`:""}
  <div class="teamname">${esc(teamName(c))}</div>
  <small>${esc(t.abbreviation||"")}
   · ${c.homeAway==="home"?"主":"客"}
  </small>
  ${played?`
   <div class="score">${esc(c.score??"—")}</div>
  `:""}
 </div>`;
}

function gameCard(g){
 const c=g.competitions?.[0]?.competitors||[];
 const a=c.find(x=>x.homeAway==="away");
 const h=c.find(x=>x.homeAway==="home");

 if(!a||!h)return "";

 const played=state(g)!=="尚未開賽";
 const o=market(g,a,h);

 const w=played?null:winModel(a,h);
 const s=played||o.home===null?
  null:coverModel(a,h,o.home);

 let summary="";

 if(played){
  summary="比賽已開始或完賽，停止新的賽前預測。";
 }else if(w&&s){
  const wp=w.home>w.away?teamName(h):teamName(a);
  const sp=s.home>s.away?teamName(h):teamName(a);

  summary="獨贏模型偏向"+wp+
 "；讓分模型偏向"+sp+"。"+
 "目前策略尚未通過足夠的歷史驗證，"+
 "投注建議：觀望。";
 }else if(w){
  summary="獨贏模型已計算；讓分資料不足。";
 }else{
  summary="目前模型缺少必要的歷史資料。";
 }

 const injuryNote=injurySummary(a,h);

 return `
 <article class="card">
  <div class="cardhead">
   NBA · ${esc(twTime(g.date))}
   · ${esc(state(g))}
  </div>

  <div class="content">
   <div class="teams">
    ${teamBox(a,played)}
    <div class="vs">VS</div>
    ${teamBox(h,played)}
   </div>

   <table class="metrics">
    <thead>
     <tr>
      <th>項目</th>
      <th>${esc(teamName(a))}</th>
      <th>${esc(teamName(h))}</th>
     </tr>
    </thead>
    <tbody>
     <tr>
      <td>獨贏勝率</td>
      <td class="big">${fmtP(w?.away)}</td>
      <td class="big">${fmtP(w?.home)}</td>
     </tr>
     <tr>
      <td>真實讓分</td>
      <td>${fmtLine(o.away)}</td>
      <td>${fmtLine(o.home)}</td>
     </tr>
     <tr>
      <td>讓分勝率</td>
      <td class="big">${fmtP(s?.away)}</td>
      <td class="big">${fmtP(s?.home)}</td>
     </tr>
    </tbody>
   </table>

   <details class="analysis">
    <summary>🧠 查看 AI 分析</summary>
    <div class="detail">
     ${esc(summary)}
     ${esc(injuryNote)}
    </div>
   </details>

   <div class="meta">
    資料：ESPN｜盤口：${esc(o.source)}<br>
    盤口報價時間未驗證。<br>
    勝率為未校準的研究模型估算。
   </div>

   <button class="fav" data-fav="${esc(g.id)}">
    ${fav.includes(g.id)?"★ 已收藏":"☆ 收藏"}
   </button>
  </div>
 </article>`;
}

function render(){
 const labels={
  home:"NBA 賽事分析",
  scores:"NBA 比分",
  schedule:"NBA 賽程",
  favs:"我的收藏",
  mine:"我的設定"
 };

 $("title").textContent=labels[page];
 $("dateLabel").textContent=selected()+" · 台灣日期";

 $("settings").classList.toggle("hidden",page!=="mine");
 $("cards").classList.toggle("hidden",page==="mine");
 $("search").classList.toggle("hidden",page==="mine");

 document.querySelectorAll("nav button").forEach(b=>{
  b.classList.toggle(
   "active",b.dataset.page===page
  );
 });

 const q=$("search").value.toLowerCase().trim();

 const list=games.filter(g=>{
  const c=g.competitions?.[0]?.competitors||[];

  const matches=c.some(x=>
   (teamName(x)+" "+(x.team?.abbreviation||""))
   .toLowerCase().includes(q)
  );

  return matches&&
   (page!=="favs"||fav.includes(g.id))&&
   (page!=="scores"||
    g.status?.type?.state!=="pre");
 });

 $("count").textContent=
  page==="mine"?"設定":list.length+" 場";

 $("cards").innerHTML=page==="mine"?"":(
  list.map(gameCard).join("")||
  '<div class="empty">沒有符合條件的賽事</div>'
 );
}

async function load(){
 const token=++request;
 const day=selected();

 const before=new Date(
  new Date(day+"T00:00:00Z").getTime()-86400000
 ).toISOString().slice(0,10);

 const season=seasonYear(day);

 $("status").textContent="正在更新 NBA 資料…";

 const results=await Promise.allSettled([
  getJSON(API+"scoreboard?dates="+
   before.replace(/-/g,"")),
  getJSON(API+"scoreboard?dates="+
   day.replace(/-/g,"")),
  getJSON(STANDINGS+(season-1)),
  getJSON(STANDINGS+season),
  getJSON(API+"injuries")
 ]);

 if(token!==request)return;

 const matchMap=new Map();
 let scoreOK=0;

 for(const r of results.slice(0,2)){
  if(r.status!=="fulfilled")continue;
  scoreOK++;

  for(const g of r.value.events||[]){
   if(g.id&&g.date&&
    localDate(new Date(g.date))===day){
    matchMap.set(g.id,g);
   }
  }
 }

 if(scoreOK===0){
  $("status").textContent=
   "賽程讀取失敗，請按 ⟳ 重新整理。";
  return;
 }

 games=[...matchMap.values()].sort(
  (a,b)=>new Date(a.date)-new Date(b.date)
 );

 previousStats=results[2].status==="fulfilled"?
  parseStandings(results[2].value):new Map();

 currentStats=results[3].status==="fulfilled"?

<script>
/* Sports AI v1.7 - Verified Recent Games */
(function(){

const oldWinModel=winModel;
const oldCoverModel=coverModel;

let recentTeams=new Map();
let recentToken=0;
let recentCache=null;

// 逐日取得真實完賽資料。
// 不依賴可能不支援的日期區間 API。
async function recentResults(){
 const day=selected();
 const cutoff=Math.min(
  Date.now(),
  new Date(day+"T23:59:59Z").getTime()
 );

 const cacheKey=day;
 if(recentCache&&
    recentCache.key===cacheKey&&
    Date.now()-recentCache.time<300000){
  return recentCache.data;
 }

 const dates=[];
 for(let i=1;i<=21;i++){
  const d=new Date(cutoff-i*86400000);
  dates.push(
   d.toISOString().slice(0,10).replace(/-/g,"")
  );
 }

 const events=[];
 const seen=new Set();
 let index=0;
 let success=0;

 async function worker(){
  while(index<dates.length){
   const date=dates[index++];

   try{
    const data=await getJSON(
     API+"scoreboard?dates="+date
    );
    success++;

    for(const g of data.events||[]){
     if(!g.id||seen.has(g.id))continue;
     seen.add(g.id);

     const start=new Date(g.date).getTime();
     if(!Number.isFinite(start)||start>=cutoff)
      continue;

     const status=g.status?.type;
     if(
      status?.state!=="post"&&
      status?.completed!==true
     )continue;

     events.push(g);
    }
   }catch(e){
    // 單日讀取失敗不拿假的比分補資料。
   }
  }
 }

 await Promise.all([
  worker(),worker(),worker(),worker()
 ]);

 if(success<14){
  throw Error("近期比賽資料讀取不足");
 }

 const map=new Map();

 for(const g of events){
  const comps=g.competitions?.[0]?.competitors||[];
  if(comps.length!==2)continue;

  const a=comps.find(x=>x.homeAway==="away");
  const h=comps.find(x=>x.homeAway==="home");
  if(!a||!h)continue;

  const as=Number(a.score);
  const hs=Number(h.score);

  if(!Number.isFinite(as)||!Number.isFinite(hs))
   continue;

  for(const [team,own,other] of [
   [a,as,hs],[h,hs,as]
  ]){
   const id=String(team.team?.id||"");
   if(!id)continue;

   if(!map.has(id))map.set(id,[]);

   map.get(id).push({
    date:new Date(g.date).getTime(),
    margin:own-other,
    win:own>other?1:0
   });
  }
 }

 const final=new Map();

 for(const [id,rows] of map){
  rows.sort((a,b)=>b.date-a.date);
  const last=rows.slice(0,10);
  const lastFive=last.slice(0,5);

  if(last.length<5)continue;

  final.set(id,{
   count:last.length,
   winRate:last.reduce((n,x)=>n+x.win,0)/
    last.length,
   margin:last.reduce((n,x)=>n+x.margin,0)/
    last.length,
   fiveMargin:lastFive.reduce(
    (n,x)=>n+x.margin,0
   )/lastFive.length
  });
 }

 recentCache={
  key:cacheKey,time:Date.now(),data:final
 };

 return final;
}

function formOf(team){
 return recentTeams.get(String(team.team?.id||""));
}

function recentAdjustment(a,h){
 const ar=formOf(a),hr=formOf(h);

 if(!ar||!hr)return null;

 // 最近分差異常時限制影響幅度。
 const difference=hr.margin-ar.margin;

 return Math.max(
  -0.3,Math.min(0.3,difference*0.025)
 );
}

// 以近期真實賽果保守調整獨贏勝率。
winModel=function(a,h){
 const base=oldWinModel(a,h);
 if(!base)return null;

 const adj=recentAdjustment(a,h);
 if(adj===null)return base;

 const logit=Math.log(
  base.home/(1-base.home)
 );

 const home=1/(1+Math.exp(-(logit+adj)));

 return {home,away:1-home};
};

// 近期分差加入讓分模型，保留原模型
// 尚未校準的分差波動假設。
coverModel=function(a,h,line){
 const base=oldCoverModel(a,h,line);
 if(!base)return null;

 const ar=formOf(a),hr=formOf(h);
 if(!ar||!hr)return base;

 const recentEdge=(hr.margin-ar.margin)/2;
 const expected=base.expected+
  Math.max(-3,Math.min(3,recentEdge*0.25));

 const home=normalCDF(
  (expected+line)/12
 );

 return {home,away:1-home,expected};
};

async function updateRecent(){
 const token=++recentToken;

 try{
  const result=await recentResults();
  if(token!==recentToken)return;
  recentTeams=result;
 }catch(e){
  if(token!==recentToken)return;
  recentTeams=new Map();
 }

 render();
}

// 保留原本 load 資料讀取流程。
const oldLoad=load;
load=async function(){
 recentTeams=new Map();
 const p=oldLoad();
 await Promise.allSettled([p,updateRecent()]);
};

// 舊版按鈕已綁定舊 load，因此額外掛上
// 近期資料更新，不重複修改原本畫面。
for(const id of ["prev","today","next","refresh"]){
 $(id).addEventListener("click",()=>{
  recentTeams=new Map();
  updateRecent();
 });
}

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden)updateRecent();
});

// 初次開啟時讀取近期真實賽果。
updateRecent();

})();
</script>

 
<script>
/* Sports AI v1.8 - Historical Benchmark */
(function(){

const settings=document.getElementById("settings");
if(!settings)return;

const btn=document.createElement("button");
btn.textContent="▶ 執行歷史預測驗證";
btn.style.cssText=
 "display:block;width:100%;margin:12px 0;"+
 "background:#c52d50;padding:13px";

const output=document.createElement("div");
output.style.cssText=
 "font-size:12px;line-height:1.8;"+
 "color:#cbd5e1;white-space:pre-line";

settings.appendChild(btn);
settings.appendChild(output);

function dayString(date){
 return date.toISOString().slice(0,10)
  .replace(/-/g,"");
}

function historicalDates(){
 const dates=[];
 const start=new Date("2026-03-15T12:00:00Z");
 const end=new Date("2026-04-15T12:00:00Z");

 for(
  let d=new Date(start);
  d<=end;
  d.setUTCDate(d.getUTCDate()+1)
 ){
  dates.push(dayString(d));
 }

 return dates;
}

async function getHistory(){
 const dates=historicalDates();
 const collected=[];
 const seen=new Set();
 let index=0,success=0;

 async function worker(){
  while(index<dates.length){
   const date=dates[index++];

   try{
    const url=API+"scoreboard?dates="+date;
    const data=await getJSON(url);
    success++;

    for(const game of data.events||[]){
     if(!game.id||seen.has(game.id))continue;
     seen.add(game.id);

     if(game.status?.type?.state!=="post")
      continue;

     const teams=
      game.competitions?.[0]?.competitors||[];

     const home=teams.find(x=>x.homeAway==="home");
     const away=teams.find(x=>x.homeAway==="away");

     if(!home||!away)continue;

     const hs=Number(home.score);
     const as=Number(away.score);

     if(!Number.isFinite(hs)||
        !Number.isFinite(as)||
        hs===as)continue;

     if(!home.team?.id||!away.team?.id)continue;

     collected.push({
      id:game.id,
      date:new Date(game.date).getTime(),
      home:String(home.team.id),
      away:String(away.team.id),
      homeWin:hs>as?1:0
     });
    }
   }catch(e){}
  }
 }

 await Promise.all([
  worker(),worker(),worker(),worker()
 ]);

 if(success<24){
  throw Error(
   "ESPN 歷史資料讀取不完整（"+
   success+"/"+dates.length+" 天）"
  );
 }

 collected.sort((a,b)=>a.date-b.date);
 return collected;
}

function testElo(games){
 const rating=new Map();
 const get=id=>rating.get(id)??1500;

 const K=20;
 const homeBonus=65;

 let tested=0,correct=0;
 let brier=0;
 let loss=0;

 games.forEach((game,i)=>{
  const hr=get(game.home);
  const ar=get(game.away);

  const p=1/(
   1+Math.pow(10,(ar-hr-homeBonus)/400)
  );

  // 前40場只用來初始化評級。
  // 後面每一場都先預測，再更新 Elo。
  if(i>=40){
   tested++;

   if((p>=0.5)===(game.homeWin===1))
    correct++;

   brier+=Math.pow(p-game.homeWin,2);

   const bounded=Math.min(
    0.999999,Math.max(0.000001,p)
   );

   loss-=game.homeWin*Math.log(bounded)+
    (1-game.homeWin)*Math.log(1-bounded);
  }

  const shift=K*(game.homeWin-p);

  rating.set(game.home,hr+shift);
  rating.set(game.away,ar-shift);
 });

 if(tested<30){
  throw Error("有效測試場次不足");
 }

 return {
  total:games.length,
  tested,
  accuracy:100*correct/tested,
  brier:brier/tested,
  logloss:loss/tested
 };
}

btn.onclick=async()=>{
 btn.disabled=true;
 btn.textContent="正在驗證歷史賽事…";
 output.textContent=
  "讀取 2026/03/15～04/15 的真實賽果。\n"+

 try{

   "Brier Score："+result.brier.toFixed(4)+"\n"+
   "Log Loss："+result.logloss.toFixed(4)+"\n\n"+
   "參考：永遠預測50%時，Brier Score為0.2500。\n"+
   "Brier與Log Loss越低越好。\n"+
   "注意：這是短期 Elo 基準，尚未驗證目前App使用的模型。"+
   "不包含傷兵修正或讓分預測驗證。";

 }catch(e){
  output.textContent=

   "\n本次結果不納入模型。";
 }finally{
  btn.disabled=false;
  btn.textContent="▶ 重新執行歷史驗證";
 }
};

})();
</script>

 
<script>
/* Sports AI - Current Strategy Replay */
(function(){
 const settings=document.getElementById("settings");
 if(!settings)return;

 // 避免與之前的獨立 Elo 測試混淆
 settings.querySelectorAll("button").forEach(b=>{
  if(b.textContent.includes("歷史預測驗證")){
   b.style.display="none";
  }
 });

 const btn=document.createElement("button");
 btn.textContent="▶ 回測目前策略";
 btn.style.cssText=
  "width:100%;margin:12px 0;"+
  "background:#c52d50;padding:13px";

 const report=document.createElement("div");
 report.style.cssText=
  "font-size:12px;line-height:1.9;"+
  "white-space:pre-line;color:#cad6e7";

 settings.append(btn,report);

 const sigmoid=x=>1/(1+Math.exp(-x));
 const bounded=(x,a,b)=>Math.max(a,Math.min(b,x));

 function dateKey(d){
  return d.toISOString().slice(0,10)
   .replace(/-/g,"");
 }

 function dates(){
  const list=[];
  for(let d=new Date("2026-10-20T12:00:00Z");
      d<=new Date("2026-10-25T12:00:00Z");
      d.setUTCDate(d.getUTCDate()+1)){
   list.push(dateKey(d));
  }
  return list;
 }

 async function history(){
  const days=dates();
  const jobs=await Promise.allSettled(
   days.map(d=>getJSON(
    API+"scoreboard?dates="+d
   ))
  );

  let succeeded=0;
  const all=new Map();

  jobs.forEach(job=>{
   if(job.status!=="fulfilled")return;
   succeeded++;

   for(const e of job.value.events||[]){
    if(e.id&&!all.has(e.id)){
     all.set(e.id,e);
    }
   }
  });

  if(succeeded<5){
   throw Error(
    "賽果讀取不足："+succeeded+"/6 天"
   );
  }

  const results=[];

  for(const e of all.values()){
   if(e.status?.type?.state!=="post")
    continue;

   const c=e.competitions?.[0];
   const teams=c?.competitors||[];

   const h=teams.find(x=>x.homeAway==="home");
   const a=teams.find(x=>x.homeAway==="away");

   if(!h||!a)continue;

   const hs=Number(h.score);
   const as=Number(a.score);

   if(!Number.isFinite(hs)||
      !Number.isFinite(as)||
      hs===as)continue;

   const home=String(h.team?.id||"");
   const away=String(a.team?.id||"");

   if(!home||!away)continue;

   const time=new Date(e.date).getTime();
   if(!Number.isFinite(time))continue;

   results.push({
    time,home,away,
    homeName:teamName(h),
    awayName:teamName(a),
    margin:hs-as,
    odds:c.odds||[]
   });
  }

  results.sort((a,b)=>a.time-b.time);
  return results;
 }

 function teamForm(games,id){
  const played=games.filter(g=>
   g.home===id||g.away===id
  );

  const margins=played.map(g=>
   g.home===id?g.margin:-g.margin
  );

  const wins=margins.filter(x=>x>0).length;
  const n=margins.length;

  const last=played.slice(-10);
  const recentMargins=last.map(g=>
   g.home===id?g.margin:-g.margin
  );

  return {
   n,w:wins,
   p:n?wins/n:0.5,
   margin:n?
    margins.reduce((a,b)=>a+b,0)/n:0,
   recent:recentMargins.length>=5?{
    p:recentMargins.filter(x=>x>0).length/
      recentMargins.length,
    margin:recentMargins.reduce((a,b)=>a+b,0)/
      recentMargins.length
   }:null
  };
 }

 function blendRate(prior,form,key){
  if(!Number.isFinite(prior?.[key]))
   return null;

  if(!form.n)return prior[key];

  return (
   12*prior[key]+form.n*form[key]
  )/(12+form.n);
 }

 function lineOf(g){
  for(const o of g.odds){
   const m=String(o.details||"").trim().match(
    /^([A-Z]{2,5})\s*([+-]\d+(?:\.\d+)?)$/i
   );

   if(!m)continue;

   // 歷史賽事需要取得可辨識的主客隊縮寫
   const ab=m[1].toUpperCase();

   // 由 ESPN 賽事資料保存的縮寫對應
   const homeAb=g.homeAb;
   const awayAb=g.awayAb;

   const n=Number(m[2]);
   if(ab===homeAb)return n;
   if(ab===awayAb)return -n;
  }

  return null;
 }

 function calculate(g,previous,prior){
  const hp=prior.get(g.home);
  const ap=prior.get(g.away);

  if(!hp||!ap||hp.n<20||ap.n<20)
   return null;

  const earlier=previous.filter(x=>x.time<g.time);
  const hf=teamForm(earlier,g.home);
  const af=teamForm(earlier,g.away);

  const hr=blendRate(hp,hf,"p");
  const ar=blendRate(ap,af,"p");

  if(hr===null||ar===null)return null;

  let logit=2.4*(hr-ar)+0.12;

  if(hf.recent&&af.recent){
   logit+=0.5*(hf.recent.p-af.recent.p);
   logit+=bounded(
    (hf.recent.margin-af.recent.margin)*0.025,
    -0.3,0.3
   );
  }

  const homeWin=sigmoid(logit);

  const hm=blendRate(hp,hf,"margin");
  const am=blendRate(ap,af,"margin");

  let expected=null;

  if(hm!==null&&am!==null){
   expected=(hm-am)/2+2.5;

   if(hf.recent&&af.recent){
    expected+=bounded(
     (hf.recent.margin-af.recent.margin)*
     0.125,
     -3,3
    );
   }
  }

  return {homeWin,expected};
 }

 btn.onclick=async()=>{
  btn.disabled=true;
  report.textContent="正在讀取真實比賽…";

  try{
   const [events,priorJson]=await Promise.all([
    history(),
    getJSON(STANDINGS+"2026")
   ]);

   const prior=parseStandings(priorJson);
   if(prior.size<25){
    throw Error(
     "上季球隊實力資料不完整"
    );
   }

   // 日期資料的盤口代碼必須從原始賽事建立
   const rawDays=await Promise.allSettled(
    dates().map(d=>getJSON(
     API+"scoreboard?dates="+d
    ))
   );

   const abbreviations=new Map();

   rawDays.forEach(job=>{
    if(job.status!=="fulfilled")return;

    for(const e of job.value.events||[]){
     const c=e.competitions?.[0]?.competitors||[];
     const h=c.find(x=>x.homeAway==="home");
     const a=c.find(x=>x.homeAway==="away");

     if(h&&a){
      abbreviations.set(e.id,{
       home:h.team?.abbreviation?.toUpperCase(),
       away:a.team?.abbreviation?.toUpperCase(),
       time:new Date(e.date).getTime()
      });
     }
    }
   });

   // 用隊伍與開始時間匹配同場資料
   // 此處若無法可靠對應縮寫，就不測讓分。
   const perGame=new Map();

   rawDays.forEach(job=>{
    if(job.status!=="fulfilled")return;

    for(const e of job.value.events||[]){
     const c=e.competitions?.[0]?.competitors||[];
     const h=c.find(x=>x.homeAway==="home");
     const a=c.find(x=>x.homeAway==="away");
     if(!h||!a)continue;

     perGame.set(
      String(h.team?.id)+"|"+
      String(a.team?.id)+"|"+
      new Date(e.date).getTime(),
      {
       home:h.team?.abbreviation?.toUpperCase(),
       away:a.team?.abbreviation?.toUpperCase()
      }
     );
    }
   });

   let winN=0,winCorrect=0,brier=0;
   let coverN=0,coverCorrect=0,pushes=0;
   let missingLine=0;

   for(const g of events){
    const calc=calculate(g,events,prior);
    if(!calc)continue;

    winN++;
    const actual=g.margin>0?1:0;

    if((calc.homeWin>=0.5)===(actual===1))
     winCorrect++;

    brier+=(calc.homeWin-actual)**2;

    const code=perGame.get(
     g.home+"|"+g.away+"|"+g.time
    );

    if(code){
     g.homeAb=code.home;
     g.awayAb=code.away;
    }

    const line=lineOf(g);

    if(line===null||calc.expected===null){
     missingLine++;
     continue;
    }

    const result=g.margin+line;
    if(Math.abs(result)<0.0001){
     pushes++;
     continue;
    }

    const homeCover=normalCDF(
     (calc.expected+line)/12
    );

    coverN++;

    if((homeCover>=0.5)===(result>0))
     coverCorrect++;
   }

   report.textContent=
    "Sports AI 現有策略回放\n"+
    "測試日期：2026/10/20～10/25\n"+
    "取得完賽："+events.length+" 場\n\n"+
    "獨贏有效場數："+winN+"\n"+
    "獨贏命中："+winCorrect+" 場\n"+
    "獨贏命中率："+(
     winN?(winCorrect/winN*100).toFixed(1)+"%":"無資料"
    )+"\n"+
    "Brier Score："+(
     winN?(brier/winN).toFixed(4):"無資料"
    )+"\n\n"+
    "讓分有效場數："+coverN+"\n"+
    "模型選擇方向過盤："+coverCorrect+" 場\n"+
    "過盤率："+(
     coverN?
     (coverCorrect/coverN*100).toFixed(1)+"%":
     "無法計算"
    )+"\n"+
    "走盤："+pushes+" 場\n"+
    "缺少盤口／分差資料："+missingLine+" 場\n\n"+
    "注意：使用當時之前已完成的本季賽果，"+
    "搭配上季期末戰績作為先驗。"+
    "ESPN 的歷史盤口若沒有時間戳，"+
    "只能視為回溯參考，不能當作已驗證賽前盤口。"+
    "這是探索性回放，並非嚴格無偏差回測。";

  }catch(e){
   report.textContent=
    "回測無法完成："+e.message+
    "\n未產生虛構結果。";
  }finally{
   btn.disabled=false;
   btn.textContent="▶ 重新回測目前策略";
  }
 };
})();
</script>

 
<script>
/* Sports AI v1.9 - Pre-game Snapshot Tracker */
(function(){
 const KEY="sportsai_pregame_v19";

 function read(){
  try{
   const data=JSON.parse(localStorage.getItem(KEY)||"{}");
   return data&&typeof data==="object"?data:{};
  }catch(e){return {};}
 }

 function write(data){
  try{
   localStorage.setItem(KEY,JSON.stringify(data));
   return true;
  }catch(e){return false;}
 }

 function saveSnapshots(){
  if(typeof games==="undefined")return;

  const records=read();
  let changed=false;

  for(const g of games){
   const start=new Date(g.date).getTime();
   const now=Date.now();

   // 僅接受開賽前快照。
   if(!Number.isFinite(start)||now>=start)continue;
   if(state(g)!=="尚未開賽")continue;

   const c=g.competitions?.[0]?.competitors||[];
   const h=c.find(x=>x.homeAway==="home");
   const a=c.find(x=>x.homeAway==="away");
   if(!h||!a||!g.id)continue;

   const odds=market(g,a,h);
   const w=winModel(a,h);
   const s=Number.isFinite(odds.home)?
    coverModel(a,h,odds.home):null;

   // 只保存當下有完整預測和盤口的場次。
   if(!w||!s||
      !Number.isFinite(w.home)||
      !Number.isFinite(s.home))continue;

   const id=String(g.id);
   const snapshot={
    id,
    start,
    recorded:now,
    homeId:String(h.team?.id||""),
    awayId:String(a.team?.id||""),
    homeName:teamName(h),
    awayName:teamName(a),
    homeLine:odds.home,
    awayLine:odds.away,
    source:odds.source,
    homeWin:w.home,
    homeCover:s.home
   };

   const previous=records[id];

   // 保存首次記錄，以及目前最新賽前快照。
   if(!previous){
    records[id]={
     first:snapshot,
     latest:snapshot
    };
    changed=true;
   }else if(now>previous.latest.recorded){
    previous.latest=snapshot;
    changed=true;
   }
  }

  if(changed)write(records);
 }

 // 每當原本首頁重新計算後，記錄當下結果。
 const originalRender=render;
 render=function(){
  originalRender();
  try{saveSnapshots();}catch(e){}
 };

 // 定期檢查已顯示的比賽。
 saveSnapshots();
 setInterval(saveSnapshots,30000);

 document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
   setTimeout(saveSnapshots,1500);
  }
 });

 const settings=document.getElementById("settings");
 if(!settings)return;

 const btn=document.createElement("button");
 btn.textContent="查看賽前紀錄與實際過盤率";
 btn.style.cssText=
  "width:100%;margin:14px 0;"+
  "padding:13px;background:#bb3654";

 const result=document.createElement("div");
 result.style.cssText=
  "white-space:pre-line;line-height:1.85;"+
  "font-size:12px;color:#ced8e8";

 settings.append(btn,result);

 const fmtTime=n=>new Date(n).toLocaleString(
  "zh-TW",{
   timeZone:"Asia/Taipei",
   month:"2-digit",day:"2-digit",
   hour:"2-digit",minute:"2-digit",
   hour12:false
  }
 );

 async function findResults(entries){
  const dates=[...new Set(
   entries.map(r=>
    new Date(r.latest.start)
     .toISOString().slice(0,10)
     .replace(/-/g,"")
   )
  )];

  const found=new Map();

  for(const date of dates){
   try{
    const data=await getJSON(
     API+"scoreboard?dates="+date
    );
    for(const g of data.events||[]){
     found.set(String(g.id),g);
    }
   }catch(e){}
  }
  return found;
 }

 btn.onclick=async()=>{
  btn.disabled=true;
  result.textContent="正在核對已保存的賽前紀錄…";

  try{
   const entries=Object.values(read());
   if(!entries.length){
    result.textContent=
     "目前尚無賽前紀錄。\n"+
     "當你開啟有未開賽賽事的頁面，"+
     "且成功取得盤口與模型預測後，"+
     "系統就會開始保存。";
    return;
   }

   const completed=await findResults(entries);

   let wins=0,winN=0;
   let covers=0,coverN=0;
   let pushes=0,pending=0;
   const details=[];

   for(const row of entries){
    const r=row.latest;
    const g=completed.get(r.id);
    const c=g?.competitions?.[0]?.competitors||[];
    const h=c.find(x=>x.homeAway==="home");
    const a=c.find(x=>x.homeAway==="away");

    if(
     g?.status?.type?.state!=="post"||
     !h||!a
    ){
     pending++;
     continue;
    }

    const hs=Number(h.score);
    const as=Number(a.score);
    if(!Number.isFinite(hs)||
       !Number.isFinite(as))continue;

    const margin=hs-as;

    if(margin!==0){
     winN++;
     if((r.homeWin>=0.5)===(margin>0))
      wins++;
    }

    const adjusted=margin+r.homeLine;

    if(Math.abs(adjusted)<0.00001){
     pushes++;
    }else{
     coverN++;
     if((r.homeCover>=0.5)===(adjusted>0))
      covers++;
    }

    const pick=r.homeCover>=0.5?
     r.homeName:r.awayName;

    details.push(
     r.awayName+" "+as+" : "+hs+" "+r.homeName+
     "\n記錄："+fmtTime(r.recorded)+
     "｜主隊讓分："+r.homeLine+
     "\n讓分模型選擇："+pick+
     "｜"+(
      adjusted===0?"走盤":
      (r.homeCover>=0.5)===(adjusted>0)?
      "過盤":"未過盤"
     )
    );
   }

   const pct=(a,b)=>b?
    (100*a/b).toFixed(1)+"%":"尚無資料";

   result.textContent=
    "Sports AI 賽前預測追蹤\n"+
    "已保存賽事："+entries.length+" 場\n"+
    "尚待完賽或核對："+pending+" 場\n\n"+
    "獨贏："+wins+"/"+winN+
    "｜"+pct(wins,winN)+"\n"+
    "讓分過盤："+covers+"/"+coverN+
    "｜"+pct(covers,coverN)+"\n"+
    "走盤："+pushes+" 場\n\n"+
    details.join("\n\n")+
    "\n\n資料保存在目前瀏覽器。"+
    "使用的是最後一次成功保存的賽前盤口，"+
    "不保證是市場收盤盤口。"+
    "小樣本結果不代表未來命中率。";

  }catch(e){
   result.textContent="核對失敗："+e.message;
  }finally{
   btn.disabled=false;
  }
 };
})();
</script>

 
<script>
/* Sports AI v2.0 - Conservative Mode */
(function(){

 const originalGameCard=gameCard;

 gameCard=function(g){
  const html=originalGameCard(g);
  if(!html)return html;

  const root=document.createElement("div");
  root.innerHTML=html;

  const detail=root.querySelector(
   "details.analysis .detail"
  );

  if(!detail)return html;

  const c=g.competitions?.[0]?.competitors||[];
  const a=c.find(x=>x.homeAway==="away");
  const h=c.find(x=>x.homeAway==="home");

  if(!a||!h)return html;

  const isPregame=state(g)==="尚未開賽";
  const odds=market(g,a,h);
  const model=isPregame&&
   Number.isFinite(odds.home)?
   coverModel(a,h,odds.home):null;

  let message="";

  if(!isPregame){
   message="比賽已開始或結束，不提供賽前建議。";
  }else if(!model){
   message="建議觀望：歷史數據或讓分資料不足。";
  }else{
   const team=model.home>=0.5?
    teamName(h):teamName(a);

   message=
    "模型分析：讓分方向偏向"+team+"。"+
    "但目前策略尚未證明具有穩定過盤優勢。"+
    "投注建議：觀望。";
  }

  detail.textContent=message;
  return root.innerHTML;
 };

 render();

})();
</script>
